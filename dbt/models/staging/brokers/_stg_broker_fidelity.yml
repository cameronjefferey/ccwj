version: 2

models:
  - name: stg_broker_fidelity_history
    description: >
      Fidelity trade-history rows only (account label first token
      fidelity). One row per seed history line. Not unique at this
      grain: two fills can share a date and symbol, and dedup runs
      before the seed write plus again in stg_history.
    columns:
      - name: Account
        description: Broker display label. First token is Fidelity.
        tests:
          - not_null
      - name: tenant_id
        description: snaptrade:<uuid> stamped at sync. Isolation key.
        tests:
          - not_null
      - name: Action
        description: Seed action label (SnapTrade or CSV vocabulary).
        tests:
          - not_null
          - accepted_values:
              values:
                - Buy
                - Sell
                - Sell Short
                - Buy to Open
                - Buy to Close
                - Sell to Open
                - Sell to Close
                - Expired
                - Assigned
                - Exchange or Exercise
                - Cash Dividend
                - Qualified Dividend
                - Special Dividend
                - Special Qual Div
                - Pr Yr Cash Div
                - Credit Interest
                - Margin Interest
                - ADR Mgmt Fee
                - Deposit
                - Withdrawal
                - Cash Transfer
                - Funds Received
                - MoneyLink Transfer
                - Journal

  - name: stg_broker_fidelity_current
    description: >
      Fidelity open-position snapshot rows. Holdings grain is one row
      per (tenant_id, symbol); see fidelity_current_symbol_unique.
      Mutual funds stay Equity. Core sweeps are Cash and Money Market
      and are not a second copy of cash.
    columns:
      - name: Account
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: Symbol
        tests:
          - not_null
      - name: security_type
        description: >
          Equity for stocks, ETFs, and mutual funds. Option for
          contracts. Cash and Money Market for core-position sweeps
          (cash_equivalent), which stg_current does not treat as a holding.
        tests:
          - not_null

  - name: stg_broker_fidelity_balances
    description: >
      Fidelity cash and account-total lines from the balances seed
      and, at lower priority, from current_positions sweep rows.
      Priority-1 rows are unique on (tenant_id, row_type); see
      fidelity_balance_priority_unique.
    columns:
      - name: account
        tests:
          - not_null
      - name: tenant_id
        tests:
          - not_null
      - name: row_type
        tests:
          - not_null
          - accepted_values:
              values: ['cash', 'account_total']
      - name: src_priority
        tests:
          - not_null
          - accepted_values:
              values: [1, 2]
              quote: false

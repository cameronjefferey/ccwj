version: 2

sources:
  # Tenant seed data — written directly by the app's sync/upload writers
  # (app/seed_store.py, WRITE_TRUNCATE per table under the cluster-wide
  # seed lock). This replaced the git-as-database flow where the same
  # three tables were dbt seeds committed to GitHub as CSVs (retired
  # Aug 2026; git history of dbt/seeds/*.csv is the archive).
  #
  # All data columns are STRING (staging safe_casts downstream, exactly
  # as it did for the STRING-pinned seeds). The extra `_row_seq` INT64
  # column preserves CSV row order for the app's byte-exact no-op check —
  # staging models never select it.
  #
  # The dataset is env-switchable so local dev builds read the dev raw
  # dataset (scripts/dev-refresh.sh sets DBT_RAW_DATASET=analytics_raw_dev);
  # CI/prod builds leave it unset -> analytics_raw.
  - name: raw_broker
    database: ccwj-dbt
    schema: "{{ env_var('DBT_RAW_DATASET', 'analytics_raw') }}"
    description: >
      Raw tenant seed tables written by the app (SnapTrade sync, manual
      CSV upload, admin purge) via app/seed_store.py. One row per broker
      fill / open position / balance line, all columns STRING, ordered
      by _row_seq.
    tables:
      - name: trade_history
      - name: current_positions
      - name: account_balances

  - name: external
    database: ccwj-dbt
    schema: analytics
    description: Tables populated outside of dbt (scripts, GitHub Actions, etc.)
    tables:
      - name: daily_position_performance
        description: >
          Daily stock close prices and dividends fetched via yfinance
          by current_position_stock_price.py (runs in GitHub Actions).
        columns:
          - name: account
          - name: symbol
          - name: date
          - name: close_price
          - name: dividend
      - name: daily_split_events
        description: >
          Stock-split corporate actions per symbol, written by
          current_position_stock_price.py (yfinance ticker.splits).
          Schema: (symbol, split_date, split_ratio). split_ratio uses
          yfinance's "shares-after / shares-before" convention — 2.0
          for a 2:1 forward split, 0.0333 for a 1:30 reverse.
          Symbol-grain (no account/user_id) — splits apply to every
          tenant who held the symbol. Consumed by stg_split_events →
          int_split_factors → int_equity_sessions / int_closed_equity_legs
          to express pre-split fills in the same share-unit as the
          post-split snapshot. Without this, a 1700-share buy followed
          by a 2:1 split followed by a 1500-share sell looks like a
          $66K phantom realized loss (1500 × pre-split $90 cost vs
          1500 × post-split $46 sell). See the XLU regression May 2026.
        columns:
          - name: symbol
          - name: split_date
          - name: split_ratio
      - name: symbol_metadata
        description: >
          Sector / subsector / market cap / company name per symbol, fetched
          via yfinance by scripts/refresh_symbol_metadata.py (runs in
          GitHub Actions). Symbol-only — no account column, safe to share.
          'subsector' is the more specific bucket nested under 'sector'
          (e.g. sector=Technology / subsector=Software-Application).
        columns:
          - name: symbol
          - name: sector
          - name: subsector
          - name: country
          - name: market_cap
          - name: long_name
          - name: fetched_at
      - name: earnings_calendar
        description: >
          Next-earnings AND next-ex-div dates per symbol, fetched via
          yfinance (Ticker.calendar) by scripts/refresh_earnings_calendar.py.
          Symbol-only — no account column, safe to share across tenants.
          Crypto is filtered out at load time. Benchmark ETFs (SPY/QQQ)
          are included so their ex-div dates land (they have no earnings).
          Other ETFs / indices / symbols with no fundamentals are
          persisted with NULL dates as a negative cache.
          yfinance often returns a single earnings date but occasionally
          a 1-2 element window — we store both earnings_window_start and
          earnings_window_end and surface the minimum as next_earnings_date.
          Ex-Dividend Date / Dividend Date are persisted as
          next_ex_div_date / next_dividend_pay_date (Daily Review prefers
          these over the last+median cadence heuristic).
        columns:
          - name: symbol
          - name: next_earnings_date
          - name: earnings_window_start
          - name: earnings_window_end
          - name: next_ex_div_date
          - name: next_dividend_pay_date
          - name: fetched_at

<style>
    .review-hero {
        background: #121826;
        border-radius: 20px;
        padding: 1.35rem 1.6rem 1.25rem;
        color: #fff;
        margin-bottom: 1.5rem;
    }
    .ov-bar {
        display: flex; flex-wrap: wrap; justify-content: flex-end;
        align-items: center; gap: .75rem 1rem;
        padding-bottom: 1rem; margin-bottom: 1rem;
        border-bottom: 1px solid #2a2f48;
    }
    .ov-bar:not(:has(form)) { display: none; }
    .review-hero:not(:has(:not(.ov-bar))) { display: none; }
    .ov-date { margin: 0 0 .65rem; font-size: .82rem; font-weight: 600; color: #aeb8cc; }
    .filter-bar-hero { margin: 0; gap: .65rem; }
    .filter-bar-hero .lblh { color: #aeb8cc; }
    .filter-bar-hero .form-select {
        background: #20243d; color: #fff; border-color: #3a4160;
        min-width: 140px;
    }
    .filter-bar-hero .filter-reset { color: #c3cbdb; border-color: #3a4160; }
    .filter-bar-hero .ht-ms-hint { color: #c3cbdb; font-size: .85rem; }
    .review-hero .hero-kicker {
        font-size: .68rem; text-transform: uppercase; letter-spacing: 1.1px;
        color: rgba(255,255,255,.5); font-weight: 700; margin-bottom: .35rem;
    }
    .review-hero .hero-headline {
        font-size: 1.85rem; font-weight: 750; letter-spacing: -.02em;
        line-height: 1.1; margin: 0 0 1.1rem;
    }
    .ov-top {
        display: grid;
        /* The value column is wider so a 2.75rem figure such as
           -$1,234,567 still fits once the cqi clamp hits its cap. */
        grid-template-columns: minmax(0, 1.85fr) repeat(3, minmax(0, 1fr));
        gap: .85rem 1.25rem; align-items: start;
    }
    .ov-top > div { min-width: 0; container-type: inline-size; }
    .ov-k { font-size: .8rem; color: rgba(255,255,255,.55); margin-bottom: .2rem; }
    /* Big headline figures never break mid-number. Inside a hero column
       the size tracks that column (cqi) up to 2.75rem (44px), which is
       the desktop size at 1280 and 1440. 13.5cqi is the largest factor
       that still keeps a 12-character figure such as -$1,234,567 inside
       the column when the cap has not bound. The vw clamp is only the
       fallback for a figure that is not in the grid.
       .ov-sub is the smaller line under a figure: it wraps on word
       boundaries so a long caption stays inside the column. */
    .ov-big, .ov-pct {
        white-space: nowrap;
        overflow-wrap: normal;
        word-break: normal;
    }
    .ov-big {
        font-size: clamp(1.05rem, 5.2vw, 2.75rem);
        font-weight: 750; letter-spacing: -.02em; line-height: 1.05;
        font-variant-numeric: tabular-nums;
    }
    .ov-top .ov-big:not(.ov-invest) {
        font-size: clamp(1.05rem, 13.5cqi, 2.75rem);
    }
    .ov-invest { font-size: clamp(1rem, 4.2vw, 1.65rem); }
    .ov-pct {
        font-size: clamp(0.95rem, 3.8vw, 1.45rem);
        font-weight: 750; letter-spacing: -.02em; line-height: 1.1;
        font-variant-numeric: tabular-nums;
    }
    .ov-sub {
        font-size: .85rem; margin-top: .12rem; font-variant-numeric: tabular-nums;
        white-space: normal;
        overflow-wrap: break-word;
        word-break: normal;
    }
    .ov-bench { font-size: .78rem; color: rgba(255,255,255,.5); margin-top: .15rem; }
    .ov-pct.pos, .ov-sub.pos, .ov-bench .pos, .ov-big.pos { color: var(--gain); }
    .ov-pct.neg, .ov-sub.neg, .ov-bench .neg, .ov-big.neg { color: var(--loss); }
    .ov-dash { color: rgba(255,255,255,.35); }
    .ov-line {
        margin: 1rem 0 0; padding-top: .85rem;
        border-top: 1px solid rgba(255,255,255,.12);
        color: rgba(255,255,255,.82); font-size: .95rem;
    }
    .ov-pills {
        display: flex; flex-wrap: wrap; gap: .45rem; align-items: center;
        margin-top: .85rem;
    }
    .ov-pill {
        display: inline-flex; align-items: center; gap: .4rem;
        border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
        padding: .22rem .7rem; font-size: .78rem; color: rgba(255,255,255,.82);
        text-decoration: none;
    }
    a.ov-pill:hover { color: #fff; border-color: rgba(255,255,255,.4); }
    .ov-dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; }
    .ov-dot.pre_market { background: #f59e0b; }
    .ov-dot.open { background: var(--ht-blue); }
    .ov-dot.after_hours { background: #38bdf8; }
    .ov-quiet { font-size: .78rem; color: rgba(255,255,255,.4); margin-left: .2rem; }
    @media (max-width: 760px) {
        .ov-top { grid-template-columns: 1fr 1fr; }
        .review-hero { overflow-wrap: anywhere; }
    }
    .review-hero .hero-book-label {
        font-size: .68rem; text-transform: uppercase; letter-spacing: 1.1px;
        color: rgba(255,255,255,.5); font-weight: 700; margin: 1.15rem 0 .55rem;
    }
    .review-hero .hero-book {
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: .75rem 1.25rem;
    }
    .review-hero .hero-book-k {
        font-size: .68rem; text-transform: uppercase; letter-spacing: .6px;
        color: rgba(255,255,255,.45); font-weight: 600; margin-bottom: .2rem;
    }
    .review-hero .hero-book-value {
        font-size: 1.15rem; font-weight: 700; line-height: 1.2;
        font-variant-numeric: tabular-nums;
    }
    .review-hero .hero-book-meta {
        font-size: .72rem; color: rgba(255,255,255,.45); margin-top: .15rem;
    }
    .review-hero .hero-book-dash { color: rgba(255,255,255,.35); font-weight: 600; }
    .review-hero .text-positive { color: var(--gain); }
    .review-hero .text-negative { color: var(--loss); }
    .review-hero .hero-subtitle {
        font-size: .9rem; color: rgba(255,255,255,.65); margin: 0;
    }
    .review-hero .hero-meta {
        margin-top: .85rem; font-size: .76rem; color: rgba(255,255,255,.4);
        display: flex; flex-wrap: wrap; gap: .65rem; align-items: center;
    }
    .review-hero .badge { font-size: .65rem; padding: .2rem .55rem; }
    @media (max-width: 700px) {
        .review-hero .hero-book { grid-template-columns: 1fr 1fr; }
    }

    /* Section card. Ink/surface colors are --ht-* tokens from base.html
       so they flip with data-bs-theme. Hardcoded #0f172a / #94a3b8 each
       work in only one theme. */
    .review-section {
        background: var(--ht-surface);
        border: 1px solid var(--ht-line);
        border-radius: 12px;
        box-shadow: none;
        padding: 1.25rem 1.35rem;
        margin-bottom: 1rem;
        min-width: 0;
        max-width: 100%;
    }
    .ov-page { min-width: 0; max-width: 100%; }
    .ov-block { min-width: 0; }
    .ov-block + .ov-block {
        margin-top: 1.15rem; padding-top: 1rem;
        border-top: 1px solid var(--ht-line);
    }
    .ov-head h3 {
        margin: 0; font-size: 1rem; font-weight: 650;
        letter-spacing: -.01em; color: var(--ht-ink);
    }
    .disclosure-body { padding: 0 1.1rem 1rem; min-width: 0; }
    body .ov-page .disclosure > summary .section-header { margin: 0; }
    .disclosure-note { font-size: .82rem; color: var(--ht-muted); font-weight: 500; }
    .ov-note { font-size: .85rem; color: var(--ht-muted); margin: 0 0 .75rem; max-width: 62ch; }
    .ov-subk { font-size: .78rem; font-weight: 650; color: var(--ht-label); margin: 0 0 .4rem; }
    .ov-facts {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: .75rem 1rem; margin: .75rem 0;
    }
    .ov-fact-v { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ht-ink); }
    .ov-fact-l { font-size: .78rem; color: var(--ht-ink); }
    .ov-fact-d { font-size: .75rem; color: var(--ht-muted); }
    .ov-below-slot { min-height: 0; }
    details.disclosure.since-card { padding: 0; }
    body .ov-page .badge.ov-div-chip {
        color: var(--gain) !important;
        background: color-mix(in srgb, var(--gain) 14%, transparent) !important;
        border-color: color-mix(in srgb, var(--gain) 45%, var(--ht-line)) !important;
    }
    .ov-ev-when { display: none; }
    .section-label {
        font-size: .72rem;
        text-transform: uppercase;
        letter-spacing: 1.1px;
        color: var(--ht-label);
        font-weight: 700;
        margin-bottom: 1rem;
    }
    .section-sub {
        font-size: .82rem; color: var(--ht-muted); margin: -.5rem 0 1rem;
        max-width: 56rem;
    }
    /* Collapsed methodology fine print — keeps section intros to ONE
       line (Aug 2026 readability pass); the "how" lives behind a click. */
    details.section-fine { margin-top: .6rem; }
    details.section-fine summary {
        font-size: .75rem; color: var(--ht-faint); cursor: pointer;
        user-select: none; width: fit-content;
    }
    details.section-fine summary:hover { color: var(--ht-muted); }
    details.section-fine p {
        font-size: .8rem; color: var(--ht-muted); margin: .4rem 0 0;
        max-width: 56rem;
    }

    .text-positive { color: var(--gain); }
    .text-negative { color: var(--loss); }

    /* ── Filter bar ── */
    .filter-bar {
        display: flex; align-items: center; flex-wrap: wrap;
        gap: .85rem; margin-bottom: 1rem;
    }
    .filter-bar .lblh {
        font-size: .65rem; text-transform: uppercase; letter-spacing: .5px;
        color: var(--ht-label); display: block; margin-bottom: .15rem;
    }
    .filter-reset {
        font-size: .75rem; color: var(--ht-muted); text-decoration: none;
        padding: .3rem .6rem; border-radius: 6px; border: 1px solid var(--ht-line);
    }
    .filter-reset:hover { color: var(--ht-ink); border-color: var(--ht-muted); text-decoration: none; }

    /* ── Since you last looked ── */
    .since-card {
        background: #121826;
        border: 1px solid #243049;
        border-radius: 0.75rem;
        padding: 1.1rem 1.4rem;
        margin-bottom: 1.25rem;
    }
    .since-kicker {
        font-size: .68rem; text-transform: uppercase; letter-spacing: 1.1px;
        color: #ffb454; font-weight: 700; margin-bottom: .2rem;
        display: flex; align-items: center; gap: .4rem;
    }
    .since-kicker .since-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #f59e0b;
        animation: since-pulse 2.2s infinite;
    }
    @keyframes since-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    .since-headline {
        font-size: 1rem; font-weight: 700; color: var(--ht-ink); margin: 0 0 .65rem;
    }
    .since-row {
        display: flex; flex-wrap: wrap; gap: .5rem .9rem;
        font-size: .85rem; margin-bottom: .35rem;
    }
    .since-row:last-child { margin-bottom: 0; }
    .since-chip {
        display: inline-flex; align-items: center; gap: .35rem;
        padding: .25rem .65rem; border-radius: 14px;
        background: #121826; border: 1px solid #243049;
        font-size: .8rem; text-decoration: none; color: inherit;
        white-space: nowrap;
    }
    .since-chip:hover { border-color: #cbd5e1; color: inherit; text-decoration: none; }
    .since-chip .sym { font-weight: 700; }
    .since-chip.up   { border-color: color-mix(in srgb, var(--gain) 30%, transparent);  background: color-mix(in srgb, var(--gain) 5%, transparent); }
    .since-chip.down { border-color: color-mix(in srgb, var(--loss) 30%, transparent);  background: color-mix(in srgb, var(--loss) 5%, transparent); }
    .since-chip.warn { border-color: rgba(234,179,8,.4);  background: rgba(234,179,8,.08); }
    .since-section-label {
        font-size: .68rem; text-transform: uppercase; letter-spacing: .6px;
        color: var(--ht-label); font-weight: 600; margin-right: .25rem; align-self: center;
    }

    /* ── Snapshot section ── */
    .snapshot-section { padding: 1.25rem 1.75rem; }
    .snapshot-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
    }
    .snap-cell {
        padding: .25rem .75rem .25rem 0;
        border-right: 1px solid #f0f0f0;
        margin-right: .75rem;
    }
    .snap-cell:last-child { border-right: none; margin-right: 0; }
    .snap-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .4px; color: var(--ht-label); margin-bottom: .2rem; }
    .snap-value { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .snap-meta { font-size: .75rem; color: var(--ht-muted); margin-top: .1rem; }
    @media (max-width: 600px) {
        .snapshot-row { grid-template-columns: repeat(2, 1fr); gap: .75rem 0; }
        .snap-cell { border-right: none; margin-right: 0; padding: .25rem 0; }
        .snap-cell:nth-child(odd) { border-right: 1px solid #f0f0f0; padding-right: .75rem; margin-right: .75rem; }
        .snap-cell:nth-child(5) { border-right: none; }
    }
    /* Stretch so each row's border-bottom is one continuous rule.
       Baseline alignment left cells at different heights (a 1-line
       Value next to a $ + % pair), so the lines did not line up.
       Numeric columns are right-aligned + tabular-nums so dollar
       amounts of different widths share a common edge. */
    .snapshot-table {
        display: grid;
        /* Value is max-content so a dollar amount is never clipped.
           Labels in the other columns wrap; the number stays whole. */
        grid-template-columns: minmax(0, 1.15fr) minmax(6.5rem, .9fr) max-content repeat(3, minmax(4.25rem, .8fr));
        gap: 0;
        align-items: stretch;
    }
    .snapshot-table-head, .snapshot-table-row { display: contents; }
    .snapshot-table-head > div {
        font-size: .78rem; text-transform: none; letter-spacing: 0;
        color: var(--ht-label); font-weight: 600;
        padding: 0 .6rem .5rem 0;
        border-bottom: 1px solid var(--ht-line);
    }
    .snapshot-table-row > div {
        padding: .65rem .6rem .65rem 0;
        border-bottom: 1px solid var(--ht-line);
    }
    .snapshot-table-head > div:first-child,
    .snapshot-table-row > div:first-child {
        min-width: 0;
    }
    .snapshot-table-head > div:not(:first-child),
    .snapshot-table-row > div:not(:first-child) {
        text-align: right;
    }
    .snapshot-table-row.total > div {
        border-top: 2px solid var(--ht-line);
        border-bottom: none;
        background: var(--ht-surface-2);
        padding-top: .85rem; padding-bottom: .85rem;
    }
    .snapshot-table .acct-name { font-weight: 700; color: var(--ht-ink); font-size: .9rem; line-height: 1.25; }
    .snapshot-table .acct-name-row {
        display: flex; align-items: baseline; gap: .4rem; flex-wrap: wrap;
    }
    .snapshot-table a.acct-link { display: inline; text-decoration: none; }
    .snapshot-table a.acct-link:hover { color: var(--color-mirror-ink); }
    .acct-rename {
        font-size: .68rem; font-weight: 500; color: var(--ht-muted);
        text-decoration: none; white-space: nowrap;
        margin-left: .35rem;
    }
    .acct-rename:hover { color: var(--ht-ink); text-decoration: underline; }
    .snapshot-table .acct-meta { font-size: .68rem; color: var(--ht-muted); margin-top: .1rem; }
    .snapshot-table-row.total .acct-name { color: var(--ht-ink); }
    .snapshot-table .snap-cell-val {
        font-weight: 700; font-size: .98rem; line-height: 1.15;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    /* Same size as other rows so the Total dollars share the column edge. */
    .snapshot-table .snap-cell-pct {
        font-size: .75rem; margin-top: .12rem; font-weight: 650;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .snap-h-short { display: none; }
    .acct-share-phone { display: none; }
    .snapshot-scroll { max-width: 100%; }
    .share-cell { display: flex; align-items: center; justify-content: flex-end; gap: .55rem; }
    .share-track {
        width: 72px; height: 6px; border-radius: 999px; background: #e7ecf2;
        overflow: hidden; flex: 0 0 72px;
    }
    .share-track > span {
        display: block; height: 100%; border-radius: 999px; background: #a8b8ff;
        min-width: 3px;
    }
    .share-pct { font-size: .82rem; color: var(--ht-muted); font-variant-numeric: tabular-nums; min-width: 3.2rem; text-align: right; }
    [data-bs-theme="dark"] .share-track { background: #243044; }
    .snapshot-table .snap-cell-dash { color: var(--ht-faint); font-weight: 600; }
    .snapshot-table-row.benchmark > div {
        border-bottom: none;
        background: var(--ht-surface-2);
        padding-top: .5rem; padding-bottom: .5rem;
    }
    .snapshot-table-row.benchmark .acct-name { font-weight: 600; font-style: italic; color: var(--ht-muted); font-size: .82rem; }
    .snapshot-table-row.benchmark .snap-cell-pct { font-weight: 700; font-size: .82rem; margin-top: 0; }
    .snap-bench { font-size: .68rem; color: var(--ht-faint); margin-top: .25rem; font-style: italic; }
    .snap-bench span { font-style: normal; }
    @media (max-width: 720px) {
        /* One row per account. Share of book sits under the name so
           Value / Today / 1W / 1M stay columns. The page does not
           scroll sideways; only this table does, with Account stuck. */
        .snapshot-section { padding: .7rem .5rem; overflow-x: clip; }
        .snapshot-scroll { overflow-x: auto; min-width: 0; }
        .snapshot-table {
            display: grid;
            grid-template-columns: minmax(6.25rem, 1.4fr) max-content repeat(3, max-content);
            width: max-content;
            min-width: 100%;
        }
        .snapshot-table .snap-col-share { display: none; }
        .snap-h-full { display: none; }
        .snap-h-short { display: inline; }
        .acct-share-phone {
            display: flex;
            align-items: center;
            gap: .3rem;
            margin-top: .15rem;
        }
        .acct-share-phone .share-track { width: 2.25rem; flex-basis: 2.25rem; height: 3px; }
        .acct-share-phone .share-pct { font-size: .62rem; min-width: 0; }
        .snapshot-table-head > div,
        .snapshot-table-row > div {
            padding: .4rem .4rem .4rem 0;
        }
        .snapshot-table-head > div:first-child,
        .snapshot-table-row > div:first-child {
            position: sticky;
            left: 0;
            z-index: 1;
            background: var(--ht-surface);
            padding-right: .45rem;
        }
        .snapshot-table-row.total > div:first-child {
            background: var(--ht-surface-2);
        }
        .snapshot-table .acct-name { font-size: .78rem; }
        .snapshot-table .snap-cell-val { font-size: .72rem; font-family: var(--font-mono); }
        .snapshot-table .snap-cell-pct { font-size: .62rem; font-family: var(--font-mono); }
        .snapshot-table .acct-rename { display: none; }
        .snapshot-table-row.benchmark > div:first-child {
            background: var(--ht-surface-2);
        }
    }

    /* ── Today's movers ── */
    .movers-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;
    }
    @media (max-width: 700px) { .movers-grid { grid-template-columns: 1fr; } }
    .movers-list { display: flex; flex-direction: column; gap: .35rem; }
    .mover-row {
        display: grid; grid-template-columns: 4rem 1fr auto;
        gap: .75rem; align-items: center;
        padding: .55rem .65rem;
        min-height: 3.55rem;
        border-radius: 10px;
        border: 1px solid var(--ht-line);
        background: var(--ht-surface-2);
        text-decoration: none;
        color: inherit;
    }
    .mover-row:hover { background: var(--ht-hover); color: inherit; text-decoration: none; }
    .mover-sym { font-weight: 700; font-size: .9rem; }
    .mover-pct { font-size: .72rem; color: var(--ht-muted); }
    .mover-dollar {
        font-weight: 700; font-size: .9rem;
        font-variant-numeric: tabular-nums; text-align: right;
    }
    .mover-kind {
        font-size: .62rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: .4px; color: var(--ht-muted);
    }

    /* ── Watch list ── */
    .watch-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
    }
    .watch-block { background: var(--ht-surface-2); border-radius: 12px; padding: 1rem 1.1rem; }
    .watch-block .wb-title {
        font-size: .78rem; text-transform: uppercase; letter-spacing: .6px;
        color: var(--ht-label); font-weight: 700; margin-bottom: .65rem;
        display: flex; justify-content: space-between; align-items: center;
    }
    .watch-block .wb-empty { font-size: .9rem; color: var(--ht-muted); font-style: italic; }
    /* Scroll the item list once it exceeds a comfortable height so a long
       radar (many earnings / expiries / ex-divs) doesn't stretch the page.
       The block title and footer link stay put outside this container. */
    .watch-list { max-height: 21rem; overflow-y: auto; }
    .watch-list::-webkit-scrollbar { width: 8px; }
    .watch-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .watch-list { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    .watch-item {
        display: grid; grid-template-columns: 3.4rem 1fr auto;
        gap: .65rem; padding: .6rem .15rem;
        border-bottom: 1px solid #eef2f7;
        text-decoration: none; color: inherit;
        align-items: center;
    }
    .watch-item:last-child { border-bottom: none; }
    /* Execution-review rows lead with a dollar/percent figure, wider than
       the 2-digit day counts the base grid was sized for. */
    .watch-item.exec { grid-template-columns: 5rem 1fr auto; }
    .watch-item.exec .watch-days { font-size: 1rem; }
    .watch-item:hover { background: var(--ht-hover); color: inherit; text-decoration: none; border-radius: 8px; padding-left: .5rem; padding-right: .5rem; }
    .watch-days {
        font-weight: 700; font-size: 1.3rem;
        text-align: center; line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    .watch-days-label {
        font-size: .62rem; text-transform: uppercase; letter-spacing: .5px;
        color: var(--ht-label); text-align: center; margin-top: .15rem;
    }
    .watch-sym { font-weight: 700; font-size: 1rem; color: var(--ht-ink); }
    .watch-meta { font-size: .82rem; color: var(--ht-muted); margin-top: .12rem; }
    .watch-aux { text-align: right; font-size: .82rem; color: var(--ht-muted); font-variant-numeric: tabular-nums; }
    .watch-badge {
        display: inline-block; padding: .12rem .45rem; border-radius: 10px;
        font-size: .7rem; font-weight: 700; margin-left: .3rem;
        background: var(--ht-line); color: var(--ht-label);
    }
    .watch-badge.itm { background: color-mix(in srgb, var(--loss) 10%, transparent); color: var(--loss); }
    .watch-badge.atm { background: rgba(234,179,8,.12); color: #e8c07a; }
    .watch-badge.otm { background: color-mix(in srgb, var(--gain) 8%, transparent); color: var(--gain); }
    /* EarningsFollower deep-link pill (earnings rows). Sits in the aux cell
       under the report date; a real, visible affordance — not fine print. */
    .watch-ef {
        display: inline-block; margin-top: .3rem;
        padding: .2rem .6rem; border-radius: 999px;
        font-size: .72rem; font-weight: 700; white-space: nowrap;
        background: #1e3a8a; color: #fff !important; text-decoration: none;
    }
    .watch-ef:hover { background: #1d4ed8; color: #fff; text-decoration: none; }
    @media (max-width: 640px) {
        .watch-block { padding: .8rem .7rem; }
        .watch-item,
        .watch-item.exec { grid-template-columns: 4.2rem minmax(0, 1fr); gap: .45rem .6rem; }
        .watch-aux { grid-column: 1 / -1; text-align: left; font-size: .8rem; }
        .watch-meta { overflow-wrap: anywhere; }
        .watch-ef { font-size: .66rem; padding: .18rem .45rem; }
    }

    /* ── Today strip (open positions cards) ── */
    .today-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: .75rem;
    }
    .strip-card {
        padding: .85rem 1rem;
        background: var(--ht-surface-2);
        border-radius: 10px;
        text-decoration: none;
        color: inherit;
        border: 1px solid var(--ht-line);
        transition: all .15s;
    }
    .strip-card:hover { background: var(--ht-hover); color: inherit; text-decoration: none; border-color: var(--ht-muted); box-shadow: none; }
    .strip-sym { font-weight: 700; font-size: 1rem; color: var(--ht-ink); }
    .strip-price { font-size: .75rem; color: var(--ht-muted); margin-top: .1rem; }
    .strip-pnl { font-size: .95rem; font-weight: 700; margin-top: .35rem; font-variant-numeric: tabular-nums; }
    .strip-pct { font-size: .75rem; margin-top: .1rem; font-variant-numeric: tabular-nums; }
    .strip-legs { font-size: .65rem; color: var(--ht-faint); text-transform: uppercase; letter-spacing: .4px; margin-top: .25rem; }

    /* ── Calendar heatmap ── */
    .cal-section-head {
        display: flex; align-items: baseline; justify-content: space-between;
        flex-wrap: wrap;
        gap: .35rem 1rem; max-width: 36rem; margin-bottom: .5rem;
    }
    .cal-grid-rolling {
        display: grid;
        /* minmax(0, 1fr): a day cell's dollar amount must not set the
           column's minimum width. Otherwise Mon–Fri plus the week label
           grow past the phone and the page scrolls sideways. */
        grid-template-columns: 4.5rem repeat(5, minmax(0, 1fr));
        gap: 4px;
        max-width: 36rem;
        width: 100%;
    }
    .cal-rolling-header {
        font-size: .6rem; font-weight: 600; text-transform: uppercase;
        letter-spacing: .5px; color: var(--ht-label); text-align: center;
        padding: .2rem 0;
    }
    .cal-rolling-week-label {
        font-size: .68rem; color: var(--ht-muted); text-transform: uppercase;
        letter-spacing: .4px; align-self: center; padding-left: .25rem;
        min-width: 0;
    }
    .cal-grid-rolling .cal-extra { display: none; }
    .cal-grid-rolling.is-expanded .cal-extra { display: flex; }
    .cal-grid-rolling.is-expanded .cal-rolling-week-label.cal-extra { display: block; }
    .cal-day {
        border-radius: 6px;
        padding: .4rem .25rem;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 2.6rem;
        min-width: 0;
        overflow: hidden;
        container-type: inline-size;
        font-variant-numeric: tabular-nums;
    }
    .cal-day .cal-day-num { font-size: .68rem; color: inherit; opacity: .8; line-height: 1; }
    .cal-day .cal-day-pnl {
        /* Floor stays under .5rem so a five- or six-figure day still
           fits a phone cell. The amount is never abbreviated. */
        font-size: clamp(.38rem, 16cqi, .68rem);
        font-weight: 700; margin-top: .15rem; line-height: 1;
        max-width: 100%; white-space: nowrap;
    }
    @media (max-width: 480px) {
        .cal-section-head, .cal-grid-rolling { max-width: none; }
        .cal-grid-rolling {
            grid-template-columns: 2.4rem repeat(5, minmax(0, 1fr));
            gap: 3px;
        }
        .cal-rolling-header { font-size: .55rem; letter-spacing: .2px; }
        .cal-rolling-week-label {
            font-size: .58rem; letter-spacing: 0; padding-left: 0; line-height: 1.1;
        }
        .cal-day { padding: .28rem .04rem; min-height: 2.35rem; }
        .cal-day .cal-day-num { font-size: .6rem; }
        .cal-day .cal-day-pnl { font-size: clamp(.38rem, 14cqi, .58rem); }
    }
    .cal-day.today { outline: 2px solid var(--color-mirror-ink); }
    /* Time-machine: past cells are links to the day-detail page. */
    a.cal-day-link { text-decoration: none; }
    a.cal-day-link:hover { outline: 2px solid #94a3b8; cursor: pointer; }
    /* Cell colors are inline styles built in Jinja — routed through CSS
       variables so dark mode can restyle the flat (no-data / zero /
       future) cells without touching the green/red intensity ramp,
       which reads fine on both themes. */
    .cal-grid-rolling {
        --cal-blank-bg: #f9fafb; --cal-blank-fg: #cbd5e1;
        --cal-zero-bg: #f9fafb;  --cal-zero-fg: #6b7280;
        --cal-nodata-bg: #f3f4f6; --cal-nodata-fg: #d1d5db;
        --cal-pos-fg: var(--gain);   --cal-neg-fg: var(--loss);
    }
    [data-bs-theme="dark"] .cal-grid-rolling {
        --cal-blank-bg: #10192b; --cal-blank-fg: #33415e;
        --cal-zero-bg: #10192b;  --cal-zero-fg: #64748b;
        --cal-nodata-bg: #0e1626; --cal-nodata-fg: #33415e;
        --cal-pos-fg: var(--gain);   --cal-neg-fg: var(--loss);
    }
    .cal-toggle-btn {
        background: transparent; border: 0; padding: .25rem 0;
        font-size: .68rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: .4px;
        color: var(--color-mirror-ink); cursor: pointer; white-space: nowrap;
    }
    .cal-toggle-btn:hover { color: #5b8cff; text-decoration: underline; }

    /* ── Breakdown table (positions / strategies / sectors) ── */
    .breakdown-wrap { overflow-x: auto; }
    .breakdown-table {
        width: 100%;
        border-collapse: collapse;
        font-size: .87rem;
        font-variant-numeric: tabular-nums;
    }
    .breakdown-table th, .breakdown-table td {
        padding: .55rem .65rem;
        border-bottom: 1px solid var(--ht-line);
        text-align: right;
        white-space: nowrap;
    }
    .breakdown-table th {
        font-size: .65rem; text-transform: uppercase; letter-spacing: .5px;
        color: var(--ht-label); font-weight: 700;
        border-bottom: 2px solid var(--ht-line);
        background: var(--ht-surface-2);
        position: sticky; top: 0; z-index: 1;
    }
    .breakdown-table th.left, .breakdown-table td.left { text-align: left; }
    @media (max-width: 480px) {
        /* Phone: tighter gutters + wrappable identity column so the
           Stock | Options | Total money columns fit unclipped
           (low-priority columns are already hidden via data-m). */
        .breakdown-table { font-size: .8rem; }
        .breakdown-table th, .breakdown-table td { padding: .45rem .35rem; }
        .breakdown-table th.left, .breakdown-table td.left { white-space: normal; }
    }
    .breakdown-table tbody tr:hover { background: var(--ht-hover); }
    .breakdown-table .row-symbol {
        font-weight: 700; color: var(--ht-ink); text-decoration: none;
    }
    .breakdown-table .row-symbol:hover { color: var(--color-mirror-ink); }
    .breakdown-table .row-company {
        font-size: .7rem; color: var(--ht-muted); font-weight: 400; margin-top: .1rem;
    }
    .breakdown-table .row-meta {
        font-size: .68rem; color: var(--ht-muted); margin-top: .1rem;
    }
    .breakdown-table tr.totals-row td {
        border-top: 2px solid var(--ht-line);
        border-bottom: none;
        font-weight: 700;
        background: var(--ht-surface-2);
        padding-top: .75rem; padding-bottom: .75rem;
    }
    .breakdown-table tr.benchmark-row td {
        font-style: italic;
        color: var(--ht-muted);
        background: var(--ht-surface-2);
        border-bottom: none;
    }
    .breakdown-table tr.benchmark-row .row-meta { font-style: normal; }
    .breakdown-table tr.benchmark-row .bench-na { color: #cbd5e1; }
    .pill-status {
        display: inline-block; font-size: .65rem; padding: .15rem .5rem;
        border-radius: 10px; text-transform: uppercase; letter-spacing: .4px;
        font-weight: 700;
    }
    .pill-status.open { background: color-mix(in srgb, var(--ht-blue) 14%, transparent); color: var(--ht-blue); }
    .pill-status.closed { background: rgba(100,116,139,.12); color: var(--ht-label); }
    .pill-status.today { background: rgba(37,99,235,.12); color: #5b8cff; margin-left: .35rem; }

    /* Trades today — fill-level rows (not weekly groups) */
    .tt-table { width: 100%; font-size: .9rem; border-collapse: collapse; }
    .tt-table td { padding: .45rem .4rem; border-bottom: 1px solid #243049; vertical-align: middle; }
    .tt-table tr:last-child td { border-bottom: 0; }
    .tt-money { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; white-space: nowrap; }
    .tt-muted { color: var(--ht-muted); font-size: .8rem; }
    .tt-roll-ok { color: var(--gain); font-size: .75rem; font-weight: 600; }
    .tt-roll-miss { color: #e8c07a; font-size: .75rem; font-weight: 600; }
    .tt-verb { font-size: .72rem; font-weight: 700; padding: .18rem .5rem; border-radius: 999px; white-space: nowrap; }
    .tt-verb.buy { background: #eff6ff; color: #1d4ed8; }
    .tt-verb.sell { background: color-mix(in srgb, var(--loss) 12%, transparent); color: #e8edf7; }
    .tt-verb.lifecycle { background: rgba(176,107,255,.14); color: #e8edf7; }
    .tt-sym { font-weight: 700; color: var(--ht-ink); text-decoration: none; }
    .tt-sym:hover { color: var(--color-mirror-ink); }
    .tt-empty { color: var(--ht-faint); font-size: .9rem; padding: .15rem 0; }
    .tt-cc { margin: .7rem 0 0; }
    .tt-cc-heading {
        font-size: .72rem; text-transform: uppercase; letter-spacing: 1.1px;
        color: var(--ht-label); font-weight: 700; margin: .15rem 0 .35rem;
    }
    .tt-cc-label { color: var(--ht-label, #475569); font-size: .88rem; margin: 0 0 .3rem; line-height: 1.4; }
    .tt-cc-list { margin: 0; padding-left: 1.4rem; color: var(--ht-ink); font-size: .9rem; line-height: 1.6; }
    .tt-cc-list .tt-sym { font-weight: 700; }
    .tt-cc-shares { color: var(--ht-muted); font-weight: 500; }
    .tw-tag-cell { display:flex; flex-direction:column; gap:4px; align-items:flex-start;
        border-radius:6px; transition:background-color .2s ease; padding:2px; }
    .tw-tag-chips { display:flex; flex-wrap:wrap; gap:3px; }
    .tw-tag-chip { display:inline-flex; align-items:center; gap:3px; padding:1px 7px;
        font-size:.68rem; font-weight:600; border-radius:999px;
        background:rgba(184,115,51,.14); color:var(--color-mirror-ink); transition:opacity .15s ease; }
    .tw-tag-x { border:none; background:none; color:var(--color-mirror-ink); cursor:pointer;
        font-size:.8rem; line-height:1; padding:0; }
    .tw-tag-x:hover { color:var(--loss); }
    .tw-tag-add { display:inline-flex; align-items:center; gap:4px; }
    .tw-tag-input { width:112px; height:26px; font-size:.72rem; padding:2px 6px; }
    .tw-tag-btn { height:26px; padding:0 8px; font-size:.72rem; line-height:1; }
    .tw-tag-cell.tw-tag-ok  { background:rgba(34,197,94,.14); }
    .tw-tag-cell.tw-tag-err { background:rgba(220,38,38,.14); }
    [data-bs-theme="dark"] .tw-tag-chip { background:rgba(224,181,106,.16); color:var(--color-mirror-ink); }
    [data-bs-theme="dark"] .tw-tag-x { color:var(--color-mirror-ink); }
    @media (max-width: 640px) {
        .tt-muted { overflow-wrap: anywhere; }
    }
    [data-bs-theme="dark"] .tt-table td { border-bottom-color: #2e313a; }
    [data-bs-theme="dark"] .tt-verb.buy { background: #172554; color: #93c5fd; }
    [data-bs-theme="dark"] .tt-verb.lifecycle { background: #2e1065; color: #c4b5fd; }
    [data-bs-theme="dark"] .tt-sym { color: var(--ht-ink); }
    [data-bs-theme="dark"] .pill-status.today { background: rgba(96,165,250,.18); color: #93c5fd; }

    /* Trades this week — discrete open/close events */
    .trades-block { margin-top: 1rem; }
    .trades-block + .trades-block { margin-top: 1.5rem; }
    .trades-head {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: .75rem; margin-bottom: .4rem;
    }
    .trades-title {
        font-size: .8rem; font-weight: 700; color: var(--ht-label);
        text-transform: uppercase; letter-spacing: .4px;
    }
    .trades-pnl { font-size: .85rem; font-weight: 700; }

    /* Profitability scorecard (Excel-style footer card) */
    .scorecard {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1.25rem;
        margin-top: 1.25rem;
        padding: 1rem 1.25rem;
        background: var(--ht-surface-2);
        border-radius: 12px;
        border: 1px solid var(--ht-line);
    }
    @media (max-width: 600px) { .scorecard { grid-template-columns: 1fr; } }
    .scorecard .sc-cell { text-align: left; }
    .scorecard .sc-label {
        font-size: .65rem; text-transform: uppercase; letter-spacing: .5px;
        color: var(--ht-muted); font-weight: 700; margin-bottom: .25rem;
    }
    .scorecard .sc-line {
        font-size: .85rem; color: var(--ht-label); font-variant-numeric: tabular-nums;
        line-height: 1.6;
    }
    .scorecard .sc-pct {
        font-size: 1.4rem; font-weight: 700; color: var(--ht-ink);
        line-height: 1; margin-top: .3rem;
    }

    .ov-grp {
        margin: 1.1rem .25rem .35rem;
        font-size: .82rem; font-weight: 600; color: var(--ht-muted);
    }
    .ov-head {
        display: flex; justify-content: space-between; align-items: flex-start;
        gap: .75rem; flex-wrap: wrap; margin-bottom: .9rem;
    }
    .ov-head h2 {
        margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em;
        color: var(--ht-ink);
    }
    .ov-head p { margin: .15rem 0 0; font-size: .85rem; color: var(--ht-muted); max-width: 64ch; }
    .ov-pills-lite { display: flex; gap: .4rem; flex-wrap: wrap; }
    .ov-pl {
        font-size: .78rem; font-weight: 600; border-radius: 999px;
        padding: .15rem .65rem; background: var(--ht-surface-2); color: var(--ht-label);
        white-space: nowrap;
    }
    .ov-pl.gn { background: color-mix(in srgb, var(--gain) 16%, transparent); color: var(--gain); }
    .ov-pl.rd { background: color-mix(in srgb, var(--loss) 16%, transparent); color: var(--loss); }
    .ov-pl.am { background: #2a2118; color: #e8edf7; }
    .ov-pl.in { background: rgba(91,140,255,.14); color: #e8edf7; }

    .snapshot-table .acct-rename { opacity: 0; }
    .snapshot-table-row > div:hover .acct-rename,
    .snapshot-table .acct-rename:focus-visible { opacity: 1; }
    @media (hover: none) { .snapshot-table .acct-rename { opacity: .7; } }
    .tt-table .tw-tag-add, .breakdown-table .tw-tag-add { opacity: 0; }
    .tt-table tr:hover .tw-tag-add, .breakdown-table tr:hover .tw-tag-add,
    .tw-tag-add:focus-within { opacity: 1; }
    @media (hover: none) {
        .tt-table .tw-tag-add, .breakdown-table .tw-tag-add { opacity: .75; }
    }

    .ov-mover-col { border-radius: 14px; padding: .35rem 1rem .7rem; }
    .ov-mover-col.up { background: color-mix(in srgb, var(--gain) 14%, transparent); }
    .ov-mover-col.down { background: color-mix(in srgb, var(--loss) 12%, transparent); }
    .ov-mover-k { font-size: .82rem; font-weight: 600; margin: .45rem 0 .15rem; }
    .ov-mover-col.up .ov-mover-k { color: var(--gain); }
    .ov-mover-col.down .ov-mover-k { color: var(--loss); }
    .ov-mover-col .mover-row {
        background: transparent; border: 0; border-radius: 0;
        border-top: 1px solid rgba(28,35,48,.08);
        min-height: 0; padding: .55rem 0;
        grid-template-columns: 4.5rem 1fr auto;
    }
    .ov-mover-col .movers-list { gap: 0; }
    .ov-mover-col .mover-row:first-child { border-top: 0; }
    .ov-mbar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.85); overflow: hidden; }
    .ov-mbar i { display: block; height: 100%; }
    .ov-mover-col.up .ov-mbar i { background: var(--gain); }
    .ov-mover-col.down .ov-mbar i { background: var(--loss); }
    .ov-mover-col .mover-row { border-top-color: var(--ht-line); }
    .mover-meta { overflow-wrap: anywhere; }

    .ov-held {
        text-align: left; font-size: .9rem; color: var(--ht-muted);
        margin: 0 0 1rem; padding: 0 .15rem;
    }
    .ov-held a { color: var(--color-mirror-ink); font-weight: 600; margin-left: .35rem; }

    .ov-rad { overflow-x: auto; }
    .ov-tl { min-width: 900px; }
    .ov-days, .ov-lane-grid, .ov-bg { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); }
    .ov-days { margin-left: 96px; }
    .ov-lane { display: grid; grid-template-columns: 96px 1fr; align-items: stretch; }
    .ov-bg { grid-column: 1 / -1; grid-row: 1 / -1; }
    .ov-bg i { border-left: 1px solid var(--ht-line); }
    .ov-bg i.w, .ov-dh.w { background: #1a2233; }
    [data-bs-theme="dark"] .ov-bg i.w, [data-bs-theme="dark"] .ov-dh.w { background: rgba(255,255,255,.04); }
    .ov-dh { text-align: center; font-size: .75rem; color: var(--ht-muted); line-height: 1.25; padding-top: 4px; }
    .ov-dh b { display: block; font-size: .85rem; color: var(--ht-ink); }
    .ov-ln { display: flex; align-items: center; font-size: .8rem; font-weight: 600; }
    .ov-ev {
        margin: 4px 2px; padding: 3px 5px; border-radius: 8px; border-left: 3px solid;
        font-size: .74rem; line-height: 1.25; overflow: visible;
        z-index: 1; align-self: start; text-decoration: none;
        min-width: 0; max-width: 100%; box-sizing: border-box;
        height: auto;
    }
    .ov-ev b, .ov-ev small {
        display: block; max-width: 100%;
        white-space: normal;
        overflow-wrap: normal; word-break: normal; hyphens: none;
    }
    .ov-ev b {
        font-size: .76rem; white-space: normal; overflow: hidden;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .ov-ev small {
        font-size: .68rem; opacity: .85; white-space: normal;
        overflow: visible; text-overflow: clip;
    }
    .ov-ev.er { background: #2a2118; border-color: #e8c07a; color: #e8edf7; }
    .ov-ev.ex { background: rgba(91,140,255,.18); border-color: #a8b8ff; color: #e8edf7; }
    .ov-ev.vd { background: rgba(91,140,255,.14); border: 1px dashed #a8b8ff; border-left: 3px solid #a8b8ff; color: #e8edf7; }
    .ov-ev.dv { background: color-mix(in srgb, var(--gain) 16%, transparent); border-color: var(--gain); color: #e8edf7; }

    .ov-verdict {
        display: grid; grid-template-columns: 110px 1fr; gap: 4px 16px; align-items: center;
        padding: .85rem 1rem; border-radius: 14px; text-decoration: none; color: inherit;
    }
    .ov-verdict.up { background: color-mix(in srgb, var(--gain) 14%, transparent); }
    .ov-verdict.down { background: color-mix(in srgb, var(--loss) 12%, transparent); }
    .ov-verdict strong { font-size: 1.75rem; letter-spacing: -.02em; line-height: 1.1; }
    .ov-verdict.up strong { color: var(--gain); }
    .ov-verdict.down strong { color: var(--loss); }
    .ov-verdict small { display: block; font-size: .78rem; color: var(--ht-muted); }
    .ov-verdict p { margin: 0; }
    .ov-verdict .h { font-size: 1.02rem; font-weight: 700; }
    .ov-verdict .h small { display: inline; margin-left: .5rem; font-weight: 400; }
    .ov-wait { margin: .75rem .1rem 0; font-size: .88rem; color: var(--ht-muted); }
    .cal-day { border-radius: 10px; }
    @media (max-width: 860px) {

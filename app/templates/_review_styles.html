<style>
    .review-hero {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        border-radius: 16px;
        padding: 2rem 2rem;
        color: #fff;
        margin-bottom: 1.5rem;
    }
    .review-hero .hero-kicker {
        font-size: .68rem; text-transform: uppercase; letter-spacing: 1.1px;
        color: rgba(255,255,255,.5); font-weight: 700; margin-bottom: .35rem;
    }
    .review-hero .hero-headline {
        font-size: 1.65rem; font-weight: 700; line-height: 1.2; margin: 0 0 .35rem;
    }
    .review-hero .hero-headline .delta-num { font-variant-numeric: tabular-nums; }
    .review-hero .hero-subtitle {
        font-size: .9rem; color: rgba(255,255,255,.65); margin: 0;
    }
    .review-hero .hero-meta {
        margin-top: .85rem; font-size: .76rem; color: rgba(255,255,255,.4);
        display: flex; flex-wrap: wrap; gap: .65rem; align-items: center;
    }
    .review-hero .badge { font-size: .65rem; padding: .2rem .55rem; }

    /* Section card. Ink/surface colors are --ht-* tokens from base.html
       so they flip with data-bs-theme. Hardcoded #0f172a / #94a3b8 each
       work in only one theme. */
    .review-section {
        background: var(--ht-surface);
        border-radius: 16px;
        box-shadow: 0 1px 8px rgba(0,0,0,.05);
        padding: 1.5rem 1.75rem;
        margin-bottom: 1.25rem;
    }
    .section-label {
        font-size: .72rem;
        text-transform: uppercase;
        letter-spacing: 1.1px;
        color: var(--ht-label);
        font-weight: 700;
        margin-bottom: 1rem;
    }
    .section-sub {
        font-size: .82rem; color: var(--ht-muted); margin: -.5rem 0 1rem;
        max-width: 56rem;
    }
    /* Collapsed methodology fine print — keeps section intros to ONE
       line (Aug 2026 readability pass); the "how" lives behind a click. */
    details.section-fine { margin-top: .6rem; }
    details.section-fine summary {
        font-size: .75rem; color: var(--ht-faint); cursor: pointer;
        user-select: none; width: fit-content;
    }
    details.section-fine summary:hover { color: var(--ht-muted); }
    details.section-fine p {
        font-size: .8rem; color: var(--ht-muted); margin: .4rem 0 0;
        max-width: 56rem;
    }

    .text-positive { color: #15803d; }
    .text-negative { color: #b91c1c; }

    /* ── Filter bar ── */
    .filter-bar {
        display: flex; align-items: center; flex-wrap: wrap;
        gap: .85rem; margin-bottom: 1rem;
    }
    .filter-bar .lblh {
        font-size: .65rem; text-transform: uppercase; letter-spacing: .5px;
        color: var(--ht-label); display: block; margin-bottom: .15rem;
    }
    .filter-reset {
        font-size: .75rem; color: var(--ht-muted); text-decoration: none;
        padding: .3rem .6rem; border-radius: 6px; border: 1px solid var(--ht-line);
    }
    .filter-reset:hover { color: var(--ht-ink); border-color: var(--ht-muted); text-decoration: none; }

    /* ── Since you last looked ── */
    .since-card {
        background: linear-gradient(135deg, #fffaf0 0%, #fff 100%);
        border: 1px solid #fde68a;
        border-radius: 14px;
        padding: 1.1rem 1.4rem;
        margin-bottom: 1.25rem;
        box-shadow: 0 1px 8px rgba(234, 179, 8, .08);
    }
    .since-kicker {
        font-size: .68rem; text-transform: uppercase; letter-spacing: 1.1px;
        color: #b45309; font-weight: 700; margin-bottom: .2rem;
        display: flex; align-items: center; gap: .4rem;
    }
    .since-kicker .since-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #f59e0b;
        animation: since-pulse 2.2s infinite;
    }
    @keyframes since-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    .since-headline {
        font-size: 1rem; font-weight: 700; color: var(--ht-ink); margin: 0 0 .65rem;
    }
    .since-row {
        display: flex; flex-wrap: wrap; gap: .5rem .9rem;
        font-size: .85rem; margin-bottom: .35rem;
    }
    .since-row:last-child { margin-bottom: 0; }
    .since-chip {
        display: inline-flex; align-items: center; gap: .35rem;
        padding: .25rem .65rem; border-radius: 14px;
        background: #fff; border: 1px solid #e5e7eb;
        font-size: .8rem; text-decoration: none; color: inherit;
        white-space: nowrap;
    }
    .since-chip:hover { border-color: #cbd5e1; color: inherit; text-decoration: none; }
    .since-chip .sym { font-weight: 700; }
    .since-chip.up   { border-color: rgba(25,135,84,.3);  background: rgba(25,135,84,.05); }
    .since-chip.down { border-color: rgba(220,53,69,.3);  background: rgba(220,53,69,.05); }
    .since-chip.warn { border-color: rgba(234,179,8,.4);  background: rgba(234,179,8,.08); }
    .since-section-label {
        font-size: .68rem; text-transform: uppercase; letter-spacing: .6px;
        color: var(--ht-label); font-weight: 600; margin-right: .25rem; align-self: center;
    }

    /* ── Snapshot section ── */
    .snapshot-section { padding: 1.25rem 1.75rem; }
    .snapshot-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
    }
    .snap-cell {
        padding: .25rem .75rem .25rem 0;
        border-right: 1px solid #f0f0f0;
        margin-right: .75rem;
    }
    .snap-cell:last-child { border-right: none; margin-right: 0; }
    .snap-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .4px; color: var(--ht-label); margin-bottom: .2rem; }
    .snap-value { font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
    .snap-meta { font-size: .75rem; color: var(--ht-muted); margin-top: .1rem; }
    @media (max-width: 600px) {
        .snapshot-row { grid-template-columns: repeat(2, 1fr); gap: .75rem 0; }
        .snap-cell { border-right: none; margin-right: 0; padding: .25rem 0; }
        .snap-cell:nth-child(odd) { border-right: 1px solid #f0f0f0; padding-right: .75rem; margin-right: .75rem; }
        .snap-cell:nth-child(5) { border-right: none; }
    }
    .snapshot-table {
        display: grid;
        grid-template-columns: minmax(140px, 1.4fr) repeat(4, 1fr);
        gap: 0; align-items: baseline;
    }
    .snapshot-table-head, .snapshot-table-row { display: contents; }
    .snapshot-table-head > div {
        font-size: .68rem; text-transform: uppercase; letter-spacing: .4px;
        color: var(--ht-label); font-weight: 700;
        padding: 0 .6rem .5rem 0;
        border-bottom: 1px solid var(--ht-line);
    }
    .snapshot-table-row > div {
        padding: .65rem .6rem .65rem 0;
        border-bottom: 1px solid var(--ht-line);
    }
    .snapshot-table-row.total > div {
        border-top: 2px solid var(--ht-line);
        border-bottom: none;
        background: var(--ht-surface-2);
        padding-top: .85rem; padding-bottom: .85rem;
    }
    .snapshot-table .acct-name { font-weight: 700; color: var(--ht-ink); font-size: .9rem; line-height: 1.25; }
    .snapshot-table a.acct-link { display: block; text-decoration: none; }
    .snapshot-table a.acct-link:hover { color: #2563eb; }
    .snapshot-table .acct-meta { font-size: .68rem; color: var(--ht-muted); margin-top: .1rem; }
    .snapshot-table-row.total .acct-name { color: var(--ht-ink); }
    .snapshot-table .snap-cell-val { font-weight: 700; font-size: .98rem; line-height: 1.15; }
    .snapshot-table-row.total .snap-cell-val { font-size: 1.1rem; }
    .snapshot-table .snap-cell-pct { font-size: .72rem; color: var(--ht-muted); margin-top: .15rem; }
    .snapshot-table .snap-cell-dash { color: var(--ht-faint); font-weight: 600; }
    .snapshot-table-row.benchmark > div {
        border-bottom: none;
        background: var(--ht-surface-2);
        padding-top: .5rem; padding-bottom: .5rem;
    }
    .snapshot-table-row.benchmark .acct-name { font-weight: 600; font-style: italic; color: var(--ht-muted); font-size: .82rem; }
    .snapshot-table-row.benchmark .snap-cell-pct { font-weight: 700; font-size: .82rem; margin-top: 0; }
    .snap-bench { font-size: .68rem; color: var(--ht-faint); margin-top: .25rem; font-style: italic; }
    .snap-bench span { font-style: normal; }
    @media (max-width: 720px) {
        .snapshot-table { grid-template-columns: minmax(110px, 1.2fr) repeat(3, 1fr); }
        .snapshot-table .snap-col-month { display: none; }
    }
    @media (max-width: 480px) {
        /* Phone: every horizontal pixel counts — tighter gutters so the
           value + vs-yesterday + vs-1w columns fit unclipped at 390px. */
        .snapshot-section { padding: .9rem .75rem; }
        .snapshot-table { grid-template-columns: minmax(88px, 1.1fr) repeat(3, minmax(0, 1fr)); }
        .snapshot-table-head > div { padding-right: .35rem; font-size: .62rem; }
        .snapshot-table-row > div { padding-right: .35rem; }
        .snapshot-table .acct-name { font-size: .82rem; }
        .snapshot-table .snap-cell-val { font-size: .88rem; }
        .snapshot-table-row.total .snap-cell-val { font-size: .95rem; }
    }

    /* ── Today's movers ── */
    .movers-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;
    }
    @media (max-width: 700px) { .movers-grid { grid-template-columns: 1fr; } }
    .movers-list { display: flex; flex-direction: column; gap: .35rem; }
    .mover-row {
        display: grid; grid-template-columns: 4rem 1fr auto;
        gap: .75rem; align-items: center;
        padding: .55rem .65rem;
        min-height: 3.55rem;
        border-radius: 10px;
        border: 1px solid var(--ht-line);
        background: var(--ht-surface-2);
        text-decoration: none;
        color: inherit;
    }
    .mover-row:hover { background: var(--ht-hover); color: inherit; text-decoration: none; }
    .mover-sym { font-weight: 700; font-size: .9rem; }
    .mover-pct { font-size: .72rem; color: var(--ht-muted); }
    .mover-dollar {
        font-weight: 700; font-size: .9rem;
        font-variant-numeric: tabular-nums; text-align: right;
    }
    .mover-kind {
        font-size: .62rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: .4px; color: var(--ht-muted);
    }

    /* ── Watch list ── */
    .watch-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
    }
    .watch-block { background: var(--ht-surface-2); border-radius: 12px; padding: 1rem 1.1rem; }
    .watch-block .wb-title {
        font-size: .78rem; text-transform: uppercase; letter-spacing: .6px;
        color: var(--ht-label); font-weight: 700; margin-bottom: .65rem;
        display: flex; justify-content: space-between; align-items: center;
    }
    .watch-block .wb-empty { font-size: .9rem; color: var(--ht-muted); font-style: italic; }
    /* Scroll the item list once it exceeds a comfortable height so a long
       radar (many earnings / expiries / ex-divs) doesn't stretch the page.
       The block title and footer link stay put outside this container. */
    .watch-list { max-height: 21rem; overflow-y: auto; }
    .watch-list::-webkit-scrollbar { width: 8px; }
    .watch-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .watch-list { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    .watch-item {
        display: grid; grid-template-columns: 3.4rem 1fr auto;
        gap: .65rem; padding: .6rem .15rem;
        border-bottom: 1px solid #eef2f7;
        text-decoration: none; color: inherit;
        align-items: center;
    }
    .watch-item:last-child { border-bottom: none; }
    /* Execution-review rows lead with a dollar/percent figure, wider than
       the 2-digit day counts the base grid was sized for. */
    .watch-item.exec { grid-template-columns: 5rem 1fr auto; }
    .watch-item.exec .watch-days { font-size: 1rem; }
    .watch-item:hover { background: var(--ht-hover); color: inherit; text-decoration: none; border-radius: 8px; padding-left: .5rem; padding-right: .5rem; }
    .watch-days {
        font-weight: 700; font-size: 1.3rem;
        text-align: center; line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    .watch-days-label {
        font-size: .62rem; text-transform: uppercase; letter-spacing: .5px;
        color: var(--ht-label); text-align: center; margin-top: .15rem;
    }
    .watch-sym { font-weight: 700; font-size: 1rem; color: var(--ht-ink); }
    .watch-meta { font-size: .82rem; color: var(--ht-muted); margin-top: .12rem; }
    .watch-aux { text-align: right; font-size: .82rem; color: var(--ht-muted); font-variant-numeric: tabular-nums; }
    .watch-badge {
        display: inline-block; padding: .12rem .45rem; border-radius: 10px;
        font-size: .7rem; font-weight: 700; margin-left: .3rem;
        background: var(--ht-line); color: var(--ht-label);
    }
    .watch-badge.itm { background: rgba(220,53,69,.1); color: #b91c1c; }
    .watch-badge.atm { background: rgba(234,179,8,.12); color: #854d0e; }
    .watch-badge.otm { background: rgba(25,135,84,.08); color: #15803d; }
    /* EarningsFollower deep-link pill (earnings rows). Sits in the aux cell
       under the report date; a real, visible affordance — not fine print. */
    .watch-ef {
        display: inline-block; margin-top: .3rem;
        padding: .2rem .6rem; border-radius: 999px;
        font-size: .72rem; font-weight: 700; white-space: nowrap;
        background: #1e3a8a; color: #fff !important; text-decoration: none;
    }
    .watch-ef:hover { background: #1d4ed8; color: #fff; text-decoration: none; }
    @media (max-width: 480px) {
        /* Phone: the subsector chips ("Communication Equipment") were
           pushing the date + EF pill off the card edge. Moneyness badges
           (ITM/ATM/OTM) are a signal, not decoration — they stay. */
        .watch-block { padding: .8rem .7rem; }
        .watch-item { grid-template-columns: 2.6rem 1fr auto; gap: .5rem; }
        .watch-sym .watch-badge:not(.itm):not(.atm):not(.otm) { display: none; }
        .watch-ef { font-size: .66rem; padding: .18rem .45rem; }
        .watch-aux { font-size: .76rem; }
    }

    /* ── Today strip (open positions cards) ── */
    .today-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: .75rem;
    }
    .strip-card {
        padding: .85rem 1rem;
        background: var(--ht-surface-2);
        border-radius: 10px;
        text-decoration: none;
        color: inherit;
        border: 1px solid var(--ht-line);
        transition: all .15s;
    }
    .strip-card:hover { background: var(--ht-hover); color: inherit; text-decoration: none; border-color: var(--ht-muted); box-shadow: 0 1px 6px rgba(0,0,0,.05); }
    .strip-sym { font-weight: 700; font-size: 1rem; color: var(--ht-ink); }
    .strip-price { font-size: .75rem; color: var(--ht-muted); margin-top: .1rem; }
    .strip-pnl { font-size: .95rem; font-weight: 700; margin-top: .35rem; font-variant-numeric: tabular-nums; }
    .strip-pct { font-size: .75rem; margin-top: .1rem; font-variant-numeric: tabular-nums; }
    .strip-legs { font-size: .65rem; color: var(--ht-faint); text-transform: uppercase; letter-spacing: .4px; margin-top: .25rem; }

    /* ── Calendar heatmap ── */
    .cal-section-head {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 1rem; max-width: 36rem; margin-bottom: .5rem;
    }
    .cal-grid-rolling {
        display: grid;
        grid-template-columns: 5rem repeat(5, 1fr);
        gap: 4px;
        max-width: 36rem;
    }
    .cal-rolling-header {
        font-size: .6rem; font-weight: 600; text-transform: uppercase;
        letter-spacing: .5px; color: var(--ht-label); text-align: center;
        padding: .2rem 0;
    }
    .cal-rolling-week-label {
        font-size: .68rem; color: var(--ht-muted); text-transform: uppercase;
        letter-spacing: .4px; align-self: center; padding-left: .25rem;
    }
    .cal-grid-rolling .cal-extra { display: none; }
    .cal-grid-rolling.is-expanded .cal-extra { display: flex; }
    .cal-grid-rolling.is-expanded .cal-rolling-week-label.cal-extra { display: block; }
    .cal-day {
        border-radius: 6px;
        padding: .4rem .25rem;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 2.6rem;
        font-variant-numeric: tabular-nums;
    }
    .cal-day .cal-day-num { font-size: .68rem; color: inherit; opacity: .8; line-height: 1; }
    .cal-day .cal-day-pnl { font-size: .68rem; font-weight: 700; margin-top: .15rem; line-height: 1; }
    .cal-day.today { outline: 2px solid #2563eb; }
    /* Time-machine: past cells are links to the day-detail page. */
    a.cal-day-link { text-decoration: none; }
    a.cal-day-link:hover { outline: 2px solid #94a3b8; cursor: pointer; }
    /* Cell colors are inline styles built in Jinja — routed through CSS
       variables so dark mode can restyle the flat (no-data / zero /
       future) cells without touching the green/red intensity ramp,
       which reads fine on both themes. */
    .cal-grid-rolling {
        --cal-blank-bg: #f9fafb; --cal-blank-fg: #cbd5e1;
        --cal-zero-bg: #f9fafb;  --cal-zero-fg: #6b7280;
        --cal-nodata-bg: #f3f4f6; --cal-nodata-fg: #d1d5db;
        --cal-pos-fg: #166534;   --cal-neg-fg: #991b1b;
    }
    [data-bs-theme="dark"] .cal-grid-rolling {
        --cal-blank-bg: #10192b; --cal-blank-fg: #33415e;
        --cal-zero-bg: #10192b;  --cal-zero-fg: #64748b;
        --cal-nodata-bg: #0e1626; --cal-nodata-fg: #33415e;
        --cal-pos-fg: #4ade80;   --cal-neg-fg: #f87171;
    }
    .cal-toggle-btn {
        background: transparent; border: 0; padding: .25rem 0;
        font-size: .68rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: .4px;
        color: #2563eb; cursor: pointer; white-space: nowrap;
    }
    .cal-toggle-btn:hover { color: #1d4ed8; text-decoration: underline; }

    /* ── Breakdown table (positions / strategies / sectors) ── */
    .breakdown-wrap { overflow-x: auto; }
    .breakdown-table {
        width: 100%;
        border-collapse: collapse;
        font-size: .87rem;
        font-variant-numeric: tabular-nums;
    }
    .breakdown-table th, .breakdown-table td {
        padding: .55rem .65rem;
        border-bottom: 1px solid var(--ht-line);
        text-align: right;
        white-space: nowrap;
    }
    .breakdown-table th {
        font-size: .65rem; text-transform: uppercase; letter-spacing: .5px;
        color: var(--ht-label); font-weight: 700;
        border-bottom: 2px solid var(--ht-line);
        background: var(--ht-surface-2);
        position: sticky; top: 0; z-index: 1;
    }
    .breakdown-table th.left, .breakdown-table td.left { text-align: left; }
    @media (max-width: 480px) {
        /* Phone: tighter gutters + wrappable identity column so the
           Stock | Options | Total money columns fit unclipped
           (low-priority columns are already hidden via data-m). */
        .breakdown-table { font-size: .8rem; }
        .breakdown-table th, .breakdown-table td { padding: .45rem .35rem; }
        .breakdown-table th.left, .breakdown-table td.left { white-space: normal; }
    }
    .breakdown-table tbody tr:hover { background: var(--ht-hover); }
    .breakdown-table .row-symbol {
        font-weight: 700; color: var(--ht-ink); text-decoration: none;
    }
    .breakdown-table .row-symbol:hover { color: #2563eb; }
    .breakdown-table .row-company {
        font-size: .7rem; color: var(--ht-muted); font-weight: 400; margin-top: .1rem;
    }
    .breakdown-table .row-meta {
        font-size: .68rem; color: var(--ht-muted); margin-top: .1rem;
    }
    .breakdown-table tr.totals-row td {
        border-top: 2px solid var(--ht-line);
        border-bottom: none;
        font-weight: 700;
        background: var(--ht-surface-2);
        padding-top: .75rem; padding-bottom: .75rem;
    }
    .breakdown-table tr.benchmark-row td {
        font-style: italic;
        color: var(--ht-muted);
        background: var(--ht-surface-2);
        border-bottom: none;
    }
    .breakdown-table tr.benchmark-row .row-meta { font-style: normal; }
    .breakdown-table tr.benchmark-row .bench-na { color: #cbd5e1; }
    .pill-status {
        display: inline-block; font-size: .65rem; padding: .15rem .5rem;
        border-radius: 10px; text-transform: uppercase; letter-spacing: .4px;
        font-weight: 700;
    }
    .pill-status.open { background: rgba(25,135,84,.08); color: #15803d; }
    .pill-status.closed { background: rgba(100,116,139,.12); color: var(--ht-label); }
    .pill-status.today { background: rgba(37,99,235,.12); color: #1d4ed8; margin-left: .35rem; }

    /* Trades today — fill-level rows (not weekly groups) */
    .tt-table { width: 100%; font-size: .9rem; border-collapse: collapse; }
    .tt-table td { padding: .45rem .4rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .tt-table tr:last-child td { border-bottom: 0; }
    .tt-money { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; white-space: nowrap; }
    .tt-muted { color: var(--ht-muted); font-size: .8rem; }
    .tt-roll-ok { color: #166534; font-size: .75rem; font-weight: 600; }
    .tt-roll-miss { color: #9a3412; font-size: .75rem; font-weight: 600; }
    .tt-verb { font-size: .72rem; font-weight: 700; padding: .18rem .5rem; border-radius: 999px; white-space: nowrap; }
    .tt-verb.buy { background: #eff6ff; color: #1d4ed8; }
    .tt-verb.sell { background: #fef2f2; color: #b91c1c; }
    .tt-verb.lifecycle { background: #f5f3ff; color: #6d28d9; }
    .tt-sym { font-weight: 700; color: var(--ht-ink); text-decoration: none; }
    .tt-sym:hover { color: #2563eb; }

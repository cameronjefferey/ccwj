{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <div class="card p-4 p-md-5 text-center">
            <p class="section-header mb-2" style="color:var(--ht-muted)">404</p>
            <h1 class="h3 mb-2">Page not found</h1>
            <p class="text-muted mb-4">That address isn't a page in HappyTrader. It may have moved.</p>
            <a href="{{ url_for('weekly_review') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary">
                Back to {{ 'Overview' if current_user.is_authenticated else 'Home' }}
            </a>
        </div>
    </div>
</div>
{% endblock %}

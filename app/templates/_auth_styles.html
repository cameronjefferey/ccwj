<style>
    :root {
        --ht-ink: #e8edf7;
        --ht-muted: #8b98b0;
        --ht-line: #243049;
        --ht-blue: #5b8cff;
        --ht-surface: #121826;
        --ht-field: #05070c;
        {% include "_gain_loss_tokens.html" %}
    }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05070c;
        font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--ht-ink);
        padding: 1.25rem 1rem;
        margin: 0;
    }
    a { color: var(--ht-blue); }
    a:hover { color: #fff; }
    .login-card {
        width: 100%;
        max-width: 28rem;
        background: var(--ht-surface);
        color: var(--ht-ink);
        border: 1px solid var(--ht-line);
        border-radius: 12px;
        box-shadow: none;
        overflow: hidden;
    }
    .login-header {
        background: rgba(255,255,255,.04);
        padding: 1.75rem 1.5rem 1.25rem;
        text-align: center;
        border-bottom: 1px solid var(--ht-line);
    }
    .login-header h1 {
        font-size: 1.65rem;
        font-weight: 650;
        letter-spacing: -0.03em;
        margin-bottom: .35rem;
        color: #fff;
    }
    .login-header p,
    .auth-trial {
        color: var(--ht-muted);
        font-size: .9rem;
        margin-bottom: 0;
    }
    .auth-headline {
        color: #fff;
        font-size: 1.05rem;
        font-weight: 650;
        line-height: 1.35;
        margin: 0;
    }
    .auth-trial { margin-top: .35rem; }
    .ht-wordmark-link {
        color: #fff;
        text-decoration: none;
    }
    .ht-wordmark-link:hover { color: #fff; }
    .login-body { padding: 1.5rem; }
    .login-card .form-label { color: var(--ht-ink); }
    .login-card .form-control,
    .login-card .input-group .btn {
        background: var(--ht-field);
        color: var(--ht-ink);
        border: 1px solid var(--ht-line);
        border-radius: 0.5rem;
    }
    .login-card .input-group > .form-control { min-width: 0; }
    .login-card .input-group > .btn {
        border-left: 0;
        color: var(--ht-muted);
        min-width: 44px;
        min-height: 44px;
    }
    .login-card .form-text,
    .login-card .text-muted { color: var(--ht-muted) !important; }
    .form-control:focus {
        border-color: rgba(91, 140, 255, 0.55);
        box-shadow: 0 0 0 .2rem rgba(91, 140, 255, 0.14);
        background: var(--ht-field);
        color: var(--ht-ink);
    }
    .btn-login {
        background: #5b8cff;
        border: none;
        color: #0a0e17;
        font-weight: 650;
        padding: .7rem 1rem;
        min-height: 48px;
        border-radius: 8px;
    }
    .btn-login:hover:not(:disabled) { color: #0a0e17; opacity: .92; }
    .btn-login:disabled {
        background: #5b8cff;
        color: #0a0e17;
        opacity: 1;
        cursor: progress;
    }
    .btn-login .spinner-border {
        color: #0a0e17;
        border-right-color: transparent;
    }
    .login-btn-progress,
    .signup-btn-progress { color: #0a0e17; font-weight: 650; }
    .alert { border-radius: 8px; }
</style>

{% if current_user.is_authenticated %}
<aside class="learn-cta">
    <h2>Practice a trade</h2>
    <a class="btn btn-primary" href="{{ url_for('paper_practice') }}">Practice</a>
    <p>Paper money. One call or one put.</p>
</aside>
{% else %}
<aside class="learn-cta">
    <h2>{{ series.cta_heading }}</h2>
    <a class="btn btn-primary" href="{{ url_for('signup') if signup_enabled else url_for('pricing') }}" data-ht-cta="create-account">{{ series.cta_button }}</a>
    <p>{{ series.cta_note }}</p>
</aside>
{% endif %}
<p class="learn-disclaimer">{{ series.disclaimer }}</p>

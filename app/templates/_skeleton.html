<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading… - HappyTrader</title>
    <link rel="icon" href="{{ url_for('favicon') }}" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
    <script>
        document.documentElement.setAttribute("data-bs-theme", "dark");
    </script>
    <style>
        :root { --sk-bg: #0a0e17; --sk-card: #121826; --sk-hint: #8a97b1; }
        html, body { margin: 0; background: var(--sk-bg); color: #e8edf7; font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .sk-wrap { max-width: 1100px; margin: 1.25rem auto; padding: 0 1rem; }
        .sk-shimmer {
            position: relative; overflow: hidden;
            background: linear-gradient(90deg, #121826, #1a2233, #121826);
            background-size: 200% 100%;
            border-radius: 0.75rem;
            animation: sk-sweep 1.4s ease-in-out infinite;
        }
        @keyframes sk-sweep {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .sk-shimmer { animation: none; }
        }
        .sk-hero { height: 148px; border-radius: 14px; }
        .sk-kpi { height: 92px; }
        .sk-row { height: 16px; margin-bottom: 14px; }
        .sk-row.short { width: 62%; }
        .sk-kpis { display: flex; gap: 12px; margin: 1rem 0 1.25rem; }
        .sk-kpis > div { flex: 1; }
        .sk-card { background: transparent; border-radius: 12px; padding: 1.25rem 0; }
        .sk-hint {
            text-align: center; color: var(--sk-hint); font-size: .82rem;
            margin-top: 1.4rem;
        }
        @media (max-width: 600px) {
            .sk-kpis { flex-wrap: wrap; }
            .sk-kpis > div { flex: 1 1 45%; }
        }
    </style>
</head>
<body>
<div class="sk-wrap">
    <div class="sk-shimmer sk-hero" aria-hidden="true"></div>
    <div class="sk-kpis" aria-hidden="true">
        <div><div class="sk-shimmer sk-kpi"></div></div>
        <div><div class="sk-shimmer sk-kpi"></div></div>
        <div><div class="sk-shimmer sk-kpi"></div></div>
        <div><div class="sk-shimmer sk-kpi"></div></div>
    </div>
    <div class="sk-card" aria-hidden="true">
        <div class="sk-shimmer sk-row"></div>
        <div class="sk-shimmer sk-row short"></div>
        <div class="sk-shimmer sk-row"></div>
        <div class="sk-shimmer sk-row short"></div>
        <div class="sk-shimmer sk-row"></div>
        <div class="sk-shimmer sk-row short"></div>
    </div>
    <p class="sk-hint" role="status">Crunching your numbers&hellip;</p>
</div>
<script>
(function () {
    "use strict";
    fetch(window.location.href, {
        credentials: "same-origin",
        headers: { "X-HT-Full": "1" }
    }).then(function (r) {
        var dest = new URL(r.url, window.location.href);
        if (dest.pathname !== window.location.pathname) {
            window.location.replace(dest.toString());
            return null;
        }
        if (!r.ok) { throw new Error("full render " + r.status); }
        return r.text();
    }).then(function (html) {
        if (html == null) return;
        document.open();
        document.write(html);
        document.close();
    }).catch(function () {
        var u = new URL(window.location.href);
        u.searchParams.set("_full", "1");
        window.location.replace(u.toString());
    });
})();
</script>
</body>
</html>

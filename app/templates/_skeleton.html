<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading… - HappyTrader</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem("ht-theme") === "dark") {
                    document.documentElement.setAttribute("data-bs-theme", "dark");
                }
            } catch (e) { /* localStorage unavailable */ }
        })();
    </script>
    <style>
        :root { --sk-bg: #eef1f6; --sk-card: #e9edf2; --sk-hint: #94a3b8; }
        [data-bs-theme="dark"] { --sk-bg: #0f172a; --sk-card: #1e293b; --sk-hint: #64748b; }
        html, body { margin: 0; background: var(--sk-bg); font-family: Inter, system-ui, sans-serif; }
        .sk-wrap { max-width: 1100px; margin: 1.25rem auto; padding: 0 1rem; }
        .sk-shimmer {
            position: relative; overflow: hidden;
            background: var(--sk-card); border-radius: 10px;
        }
        .sk-shimmer::after {
            content: ""; position: absolute; inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
            animation: sk-sweep 1.3s infinite;
        }
        @keyframes sk-sweep { 100% { transform: translateX(100%); } }
        .sk-hero { height: 148px; border-radius: 14px; }
        .sk-kpi { height: 92px; }
        .sk-row { height: 16px; margin-bottom: 14px; }
        .sk-row.short { width: 62%; }
        .sk-kpis { display: flex; gap: 12px; margin: 1rem 0 1.25rem; }
        .sk-kpis > div { flex: 1; }
        .sk-card { background: transparent; border-radius: 12px; padding: 1.25rem 0; }
        .sk-hint {
            text-align: center; color: var(--sk-hint); font-size: .82rem;
            margin-top: 1.4rem;
        }
        @media (max-width: 600px) {
            .sk-kpis { flex-wrap: wrap; }
            .sk-kpis > div { flex: 1 1 45%; }
        }
    </style>
</head>
<body>
<div class="sk-wrap">
    <div class="sk-shimmer sk-hero" aria-hidden="true"></div>
    <div class="sk-kpis" aria-hidden="true">
        <div><div class="sk-shimmer sk-kpi"></div></div>
        <div><div class="sk-shimmer sk-kpi"></div></div>
        <div><div class="sk-shimmer sk-kpi"></div></div>
        <div><div class="sk-shimmer sk-kpi"></div></div>
    </div>
    <div class="sk-card" aria-hidden="true">
        <div class="sk-shimmer sk-row"></div>
        <div class="sk-shimmer sk-row short"></div>
        <div class="sk-shimmer sk-row"></div>
        <div class="sk-shimmer sk-row short"></div>
        <div class="sk-shimmer sk-row"></div>
        <div class="sk-shimmer sk-row short"></div>
    </div>
    <p class="sk-hint" role="status">Crunching your numbers&hellip;</p>
</div>
<script>
(function () {
    "use strict";
    fetch(window.location.href, {
        credentials: "same-origin",
        headers: { "X-HT-Full": "1" }
    }).then(function (r) {
        var dest = new URL(r.url, window.location.href);
        if (dest.pathname !== window.location.pathname) {
            window.location.replace(dest.toString());
            return null;
        }
        if (!r.ok) { throw new Error("full render " + r.status); }
        return r.text();
    }).then(function (html) {
        if (html == null) return;
        document.open();
        document.write(html);
        document.close();
    }).catch(function () {
        var u = new URL(window.location.href);
        u.searchParams.set("_full", "1");
        window.location.replace(u.toString());
    });
})();
</script>
</body>
</html>

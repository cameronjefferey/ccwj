{% set _done = done_url|default(url_for("weekly_review")) %}
<script>
// Shared helper: defer a redirect while the user is mid-onboarding-form
// on /sync/processing. ``window.__onboardingHoldRedirect`` is set true
// by sync_processing.html when the user focuses the form; cleared on
// submit / skip. On every other page the var is undefined → falsy →
// no behavior change. The "ready when you are" label fires once the
// first deferral happens so the user knows they're the gate.
function __ghaSafeRedirect(url, label) {
    if (!window.__onboardingHoldRedirect) {
        window.location.href = url;
        return;
    }
    if (label) {
        label.textContent = "Ready when you are — finish your answer or open Overview.";
    }
    var iv = setInterval(function () {
        if (!window.__onboardingHoldRedirect) {
            clearInterval(iv);
            window.location.href = url;
        }
    }, 1000);
}
</script>
{% if head_sha %}
<script>
(function () {
    var sha = {{ head_sha|tojson }};
    var doneUrl = {{ _done|tojson }};
    var statusEndpoint = {{ url_for("api_github_workflow_status")|tojson }};
    var label = document.getElementById("pipelineStateLabel");
    var n = 0;
    var leaveTimer = null;
    function leaveSoon(ms) {
        if (leaveTimer) clearTimeout(leaveTimer);
        leaveTimer = setTimeout(function () { __ghaSafeRedirect(doneUrl, label); }, ms);
    }
    function stopSpinner() {
        var icon = document.getElementById("pipelineIcon") || document.getElementById("syncSpinner");
        if (!icon) return;
        var spin = icon.querySelector(".spinner-border");
        if (spin) spin.remove();
    }
    function setHeading(text) {
        var heading = document.getElementById("pipelineHeading");
        if (heading) heading.textContent = text;
    }
    function hideReadyCopy() {
        var ready = document.getElementById("pipelineReadyCopy");
        if (ready) ready.style.display = "none";
    }
    function tick() {
        n += 1;
        fetch(statusEndpoint + "?sha=" + encodeURIComponent(sha), { credentials: "same-origin" })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (!d) {
                    if (label) label.textContent = "Couldn’t check progress — taking you to Overview shortly, or go now.";
                    stopSpinner();
                    leaveSoon(8000);
                    return;
                }
                if (d.state === "error" && d.error) {
                    if (label) label.textContent = "We’ll take you to Overview in a few minutes, or you can go there now.";
                    leaveSoon(3 * 60 * 1000);
                    if (n < 120) setTimeout(tick, 8000);
                    return;
                }
                if (!d.ok) {
                    if (label) label.textContent = "Couldn’t read progress — taking you to Overview shortly, or go now.";
                    leaveSoon(8000);
                    if (n < 120) setTimeout(tick, 8000);
                    return;
                }
                if (d.state === "success") {
                    if (label) label.textContent = "All set—bringing you to Overview…";
                    __ghaSafeRedirect(doneUrl, label);
                    return;
                }
                if (d.state === "failure") {
                    stopSpinner();
                    setHeading("This update didn’t finish");
                    hideReadyCopy();
                    if (label) label.textContent = "Your files are saved. Taking you to Overview — the new numbers may not be in yet. Try Upload again in a little while if they’re missing.";
                    leaveSoon(4000);
                    return;
                }
                if (d.state === "pending") {
                    if (n < 8) {
                        if (label) label.textContent = "In the build queue…";
                    } else {
                        if (label) label.textContent = "Still queued — usually 15–40 minutes. We'll email you when Overview is ready.";
                    }
                } else if (d.state === "running") {
                    if (label) label.textContent = "Crunching your latest numbers — this can take a while.";
                } else {
                    if (label) label.textContent = "Working on it…";
                }
                if (n < 300) {
                    setTimeout(tick, 8000);
                } else {
                    stopSpinner();
                    setHeading("Still building your mirror");
                    if (label) label.textContent = "This is taking longer than usual — often because several accounts synced at once. Stay here or open Overview; we'll email you when the numbers are ready.";
                }
            })
            .catch(function () {
                if (label) label.textContent = "Still checking…";
                if (n < 30) {
                    setTimeout(tick, 10000);
                } else {
                    stopSpinner();
                    if (label) label.textContent = "Couldn’t confirm the update — taking you to Overview.";
                    leaveSoon(4000);
                }
            });
    }
    setTimeout(tick, 1500);
})();
</script>
{% else %}
<script>
(function () {
    var doneUrl = {{ _done|tojson }};
    var label = document.getElementById("pipelineStateLabel");
    if (label) { label.textContent = "We can’t show live progress for this one. Stay here or open Overview — we’ll email you when the numbers are ready."; }
})();
</script>
{% endif %}

    .ht-real-pnl .ht-hero-video::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 118%;
        height: 155%;
        transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, rgba(91,140,255,.22), rgba(91,140,255,.06) 55%, transparent 75%);
        pointer-events: none;
        z-index: 0;
        /* Drop the halo on the right and bottom so the frame can
           dissolve into plain #0a0e17 instead of a hard blue edge. */
        -webkit-mask-image:
            linear-gradient(to right, #000 50%, transparent 90%),
            linear-gradient(to bottom, #000 50%, transparent 90%);

    /* Opaque navy directly behind the picture. The wash is a sibling

       bottom, where the picture itself is fading to #0a0e17. */
    .ht-real-pnl .ht-hero-video::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        right: -90px;
        bottom: -90px;
        background: #0a0e17;
        border-radius: 0.9rem;
        z-index: 1;
        pointer-events: none;
        -webkit-mask-image:

            linear-gradient(to bottom, #000 calc(100% - 90px), transparent 100%);
        mask-image:
            linear-gradient(to right, #000 calc(100% - 90px), transparent 100%),

        mask-composite: intersect;

        border-radius: 50%;
        filter: blur(28px);
        transform: translate(-50%, -50%);
        --a: .3;
        background: radial-gradient(closest-side,
            rgba(91,140,255, calc(var(--a) * 1))    0%,
            rgba(91,140,255, calc(var(--a) * .82)) 18%,

    .ht-real-pnl .ht-glow-col {

    .ht-real-pnl .ht-lottie-hero {
        position: relative;
        z-index: 2;
        width: 100%;
        aspect-ratio: 1020 / 638;
        border-radius: 0.9rem;
        border: 1px solid rgba(91,140,255,.55);
        box-shadow: 0 0 0 6px rgba(91,140,255,.07), 0 0 60px rgba(91,140,255,.28), 0 30px 80px rgba(0,0,0,.55);
        overflow: hidden;
        background: #0c111c;
        /* Round the window to the frame. The navy backing is a separate
           box; without this the canvas corners stay square inside the mask. */
        clip-path: inset(0 round 0.9rem);
        /* Longer cosine ease on the right (from 24%) and bottom (from 16%).
           Stops are 0.5*(1+cos(pi*t)) so the ramp leaves and lands flat. */
        -webkit-mask-image:
            linear-gradient(to right, #000 24%, rgba(0,0,0,.962) 33.5%, rgba(0,0,0,.854) 43%, rgba(0,0,0,.691) 52.5%, rgba(0,0,0,.5) 62%, rgba(0,0,0,.309) 71.5%, rgba(0,0,0,.146) 81%, rgba(0,0,0,.038) 90.5%, transparent 100%),

        mask-image:
            linear-gradient(to right, #000 24%, rgba(0,0,0,.962) 33.5%, rgba(0,0,0,.854) 43%, rgba(0,0,0,.691) 52.5%, rgba(0,0,0,.5) 62%, rgba(0,0,0,.309) 71.5%, rgba(0,0,0,.146) 81%, rgba(0,0,0,.038) 90.5%, transparent 100%),
            linear-gradient(to bottom, #000 16%, rgba(0,0,0,.962) 26.5%, rgba(0,0,0,.854) 37%, rgba(0,0,0,.691) 47.5%, rgba(0,0,0,.5) 58%, rgba(0,0,0,.309) 68.5%, rgba(0,0,0,.146) 79%, rgba(0,0,0,.038) 89.5%, transparent 100%);
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;

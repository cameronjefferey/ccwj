name: Warehouse reconcile audit

# Recomputes key KPIs three ways (positions list / position detail / marts)
# and fails the job on any >$0.01 disagreement. Runs after the nightly
# warehouse rebuild window and on manual dispatch so correctness drift
# pages someone instead of sitting silent until a user notices.
on:
  schedule:
    # 02:30 UTC — after weekday SnapTrade sync (~23:00) + dbt rebuild
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: reconcile-audit
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.DBT_KEYFILE_JSON }}'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reconcile audit
        run: python scripts/audit/reconcile.py

name: Update Daily Position Performance

# Runs dbt (seeds + models) and daily prices so BigQuery marts match the
# raw seed tables (ccwj-dbt.analytics_raw, written directly by the app —
# see app/seed_store.py).
#
# Triggers:
#   - workflow_dispatch: fired by the app after every CHANGED seed write
#     (webhook sync, nightly cron batch, manual sync, CSV upload, admin
#     purge) via _dispatch_warehouse_rebuild in app/upload.py. This is the
#     primary data-driven trigger — tenant seed data no longer lives in
#     git, so there are no seed commits to react to.
#   - push to master/main: code-driven rebuilds when dbt models/macros/
#     seeds (demo + crypto only now) or the warehouse loaders change.
on:
  push:
    branches: [master, main]
    # Only rebuild the warehouse for commits that can actually change its
    # output. This job reads dbt models/macros/static seeds + a few
    # root/scripts loaders and rebuilds BigQuery; it never imports `app/`,
    # so app-code, template, docs, test, and rule commits do NOT affect
    # warehouse output and shouldn't trigger a 5-7 min rebuild.
    # paths-ignore skips a push ONLY when EVERY changed file matches — a mixed
    # commit (e.g. a dbt model + an app file) still runs. The workflow file
    # itself is intentionally NOT ignored so changes to it re-run.
    paths-ignore:
      - 'app/**'
      - 'docs/**'
      - 'tests/**'
      - '.cursor/**'
      - '**/*.md'
  workflow_dispatch:
  schedule:
    # Nightly backstop: catches a missed app dispatch (PAT hiccup, GitHub
    # API outage) and keeps date-driven marts + accumulating snapshots
    # advancing daily even on days with zero seed changes. Runs after the
    # 23:00 UTC sync cron and the evening prices refresh.
    - cron: '30 4 * * *'

# The sync (especially the multi-account "Sync all" button) can dispatch
# several rebuilds within a few seconds. Without this, every dispatch kicks
# off its own full dbt build even though only the last one's BigQuery output
# matters. Cancelling the in-flight run when a newer dispatch lands collapses
# N back-to-back rebuilds into a single build of the latest raw tables —
# which is what we want, since `merge_and_push_seeds` is monotonic: each
# write already carries every prior account's data merged in.
#
# Keep this a SINGLE group (not split by event/actor): every run does a
# `dbt build` against the SHARED BigQuery dataset, and two concurrent builds
# would race on the same tables. One group + cancel-in-progress serializes to
# exactly one live build (each build reads the newest code AND the current
# raw tables, so a cancelled build loses nothing). The nightly cron also
# writes ONE batch for all accounts (see app/snaptrade_sync_cli.py), so
# there is no per-account fan-out.
concurrency:
  group: bq-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.DBT_KEYFILE_JSON }}'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up DBT profiles
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.yml ~/.dbt/profiles.yml
          echo '${{ secrets.DBT_KEYFILE_JSON }}' > ~/.dbt/keyfile.json

      # Snapshot backup: the SCD2 snapshot tables are the only tables in the
      # warehouse that cannot be rebuilt from source (they are accumulated
      # daily observations). On 2026-08-07 the balances snapshot was silently
      # deleted by a leftover 60-day dataset default table expiration and the
      # next build recreated it empty — months of "vs yesterday/week/month"
      # history gone. Copy them aside before every build; the backup dataset
      # self-expires entries after 14 days. See scripts/snapshot_guard.py.
      - name: Back up snapshot tables
        run: python scripts/snapshot_guard.py backup
        continue-on-error: true

      # Sector / subsector: refresh BEFORE the first dbt build so
      # stg_symbol_metadata (and downstream marts that join it) have a real
      # source table to read from. Uses the previous run's stg_history for
      # the symbol list, which is fine — sectors don't change daily.
      - name: Refresh symbol metadata (sector / subsector)
        run: python scripts/refresh_symbol_metadata.py
        continue-on-error: true

      # Earnings + ex-div calendar: same shape as symbol metadata above —
      # read the previous run's stg_history for the symbol list, hit
      # yfinance Ticker.calendar per ticker (earnings AND Ex-Dividend
      # Date), WRITE_TRUNCATE the earnings_calendar table. Must run
      # before the first dbt build so stg_earnings_calendar /
      # stg_ex_div_calendar have a source to read from. continue-on-error
      # so a yfinance outage can't block the rest of the warehouse rebuild.
      - name: Refresh earnings calendar
        run: python scripts/refresh_earnings_calendar.py
        continue-on-error: true

      # Re-run history fill dedup on the raw seed before dbt tests.
      # Needed when a merge-grain fix (CSV vs SnapTrade date padding
      # or Qualified Dividend vs Cash Dividend) lands after the dirty
      # rows are already in analytics_raw — without this,
      # stg_history_no_duplicate_fills_per_tenant stays red until every
      # tenant re-syncs. No-op when the seed is clean.
      - name: Collapse already-landed duplicate history fills
        run: python scripts/repair_history_fill_dedup.py

      - name: Run DBT build (seeds + models, excluding price-dependent)
        run: |
          cd dbt
          if ! dbt build --exclude "stg_daily_prices+"; then
            python ../scripts/print_stg_history_dup_groups.py || true
            exit 1
          fi
        env:
          DBT_PROJECT_ID: ${{ secrets.DBT_PROJECT_ID }}
          DBT_GCS_BUCKET: ${{ secrets.DBT_GCS_BUCKET }}
          DBT_DATAPROC_REGION: ${{ secrets.DBT_DATAPROC_REGION }}

      - name: Fetch daily stock prices
        run: python current_position_stock_price.py

      - name: Run DBT build (price-dependent models)
        run: |
          cd dbt
          dbt build --select "stg_daily_prices+"
        env:
          DBT_PROJECT_ID: ${{ secrets.DBT_PROJECT_ID }}
          DBT_GCS_BUCKET: ${{ secrets.DBT_GCS_BUCKET }}
          DBT_DATAPROC_REGION: ${{ secrets.DBT_DATAPROC_REGION }}

      # Fail the build LOUDLY if a snapshot table lost pre-today history
      # versus this morning's backup (expiry / accidental recreate / clobber).
      # A red build beats weeks of silently rendering "—" on Daily Review.
      - name: Verify snapshot history intact
        run: python scripts/snapshot_guard.py verify

      - name: Retrain BQML behavior model
        # Uses the same DBT_KEYFILE_JSON credential as the dbt steps above
        # via google-github-actions/auth (GOOGLE_APPLICATION_CREDENTIALS
        # is exported into the runner env).  No new secrets needed.
        run: python scripts/train_bqml.py

      # Reporting is close-based: warehouse data only changes when THIS
      # workflow (or prices_refresh.yml) finishes. Telling the app "the data
      # just changed" lets its query cache hold results for hours instead of
      # minutes — the flush clears stale entries and kicks a background warm
      # of the hottest per-user query sets so even the first post-rebuild
      # visit is fast. if: always() because a partially failed build may
      # still have mutated tables (dbt is not transactional across models) —
      # serving a coherent-but-stale cache over changed tables is worse.
      # `|| true` so a flush hiccup can never fail the build.
      - name: Flush + warm app query cache
        if: always()
        run: |
          curl -fsS -m 20 -X POST "https://ccwj.onrender.com/internal/cache/flush?ready=1" \
            -H "X-Cache-Flush-Token: ${{ secrets.CACHE_FLUSH_TOKEN }}" || true

  # Keep the local-dev mirror within one build of prod. Failure here must
  # NOT fail the prod warehouse job — clone is a convenience for local
  # `./scripts/dev.sh`, not a production correctness check.
  mirror-dev:
    needs: update-performance
    if: success()
    uses: ./.github/workflows/dev_mirror.yml
    secrets: inherit


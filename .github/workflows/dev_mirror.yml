name: Mirror prod warehouse into analytics_dev

# After every production warehouse build, copy `analytics` → `analytics_dev`
# so local `./scripts/dev.sh` (BQ_DATASET=analytics_dev) sees the same marts
# customers see — without anyone running a 10-minute local dbt rebuild.
#
# The mirror job is READ-ONLY on prod. scripts/dev_clone_prod.py refuses to
# write analytics / analytics_raw / analytics_backups. It does not touch
# analytics_raw_dev (local syncs live there).
#
# A manual dispatch can instead dbt-build the selected ref into
# analytics_dev, reading prod raw seeds (`analytics_raw`) and shared market
# data (the external source dataset). The job stops after dbt and a
# select-only structural check. It does not back up snapshots, rewrite raw
# seeds, load prices, or flush the live app. Profiles come from
# dbt/profiles.dev.yml via a temp --profiles-dir so the in-repo prod
# profile cannot be selected.
#
# The dbt job runs when `dbt_build` is true, and also when this branch is
# dispatched by ref. workflow_dispatch inputs are registered from the
# default branch, which does not declare `dbt_build`, so a ref dispatch
# may arrive without the input. workflow_call from the prod warehouse
# jobs stays a clone only.
#
# Triggers:
#   - workflow_call from bigquery_update.yml and prices_refresh.yml
#     (clone). A caller that passes dbt_build runs the dev build instead.
#   - workflow_dispatch for a manual mirror, or a dev-dataset dbt build

on:
  workflow_dispatch:
    inputs:
      dbt_build:
        description: Build this ref into analytics_dev from prod raw seeds. Does not write prod.
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dbt_build:
        description: Build this ref into analytics_dev from prod raw seeds. Does not write prod.
        type: boolean
        required: false
        default: false

# Separate from the prod warehouse group. A dev build must not share
# bq-dev-mirror with the clone job or a prod mirror can cancel it.
concurrency:
  group: ${{ (inputs.dbt_build == true || github.event.inputs.dbt_build == 'true' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'cursor/vanguard-staging-031b')) && 'bq-dev-dbt' || 'bq-dev-mirror' }}
  cancel-in-progress: true

jobs:
  mirror:
    if: ${{ (github.event_name == 'workflow_call' && inputs.dbt_build != true) || (github.event_name == 'workflow_dispatch' && inputs.dbt_build != true && github.event.inputs.dbt_build != 'true' && github.ref_name != 'cursor/vanguard-staging-031b') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.DBT_KEYFILE_JSON }}'

      - name: Install BigQuery client
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery

      - name: Clone analytics → analytics_dev
        run: python scripts/dev_clone_prod.py --dest analytics_dev
        env:
          # Belt-and-suspenders: the script also refuses prod dest, but
          # never let a caller env leak a prod BQ_DATASET into --dest default.
          BQ_DATASET: analytics_dev

  dbt-dev:
    if: ${{ inputs.dbt_build == true || github.event.inputs.dbt_build == 'true' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'cursor/vanguard-staging-031b') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEMO_TEMP_SEED: ${{ vars.DEMO_TEMP_SEED || 'true' }}
      DBT_RAW_DATASET: analytics_raw
      BQ_DATASET: analytics_dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.DBT_KEYFILE_JSON }}'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare analytics_dev profile
        run: |
          set -euo pipefail
          dir=/tmp/ht-dbt-dev-profiles
          rm -rf "$dir"
          mkdir -p "$dir"
          cp dbt/profiles.dev.yml "$dir/profiles.yml"
          python scripts/vanguard_dev_structural_check.py --check-profile "$dir/profiles.yml"
          echo "DBT_PROFILES_DIR=$dir" >> "$GITHUB_ENV"
          test "$DBT_RAW_DATASET" = "analytics_raw"
          test "$BQ_DATASET" = "analytics_dev"

      - name: Confirm dbt target is analytics_dev
        run: |
          set -euo pipefail
          cd dbt
          dbt debug --profiles-dir "$DBT_PROFILES_DIR" --target dev --no-version-check > /tmp/dbt-debug.txt
          python ../scripts/vanguard_dev_structural_check.py --check-debug-log /tmp/dbt-debug.txt

      - name: Run dbt build into analytics_dev
        run: |
          set -euo pipefail
          set -o pipefail
          cd dbt
          dbt build --profiles-dir "$DBT_PROFILES_DIR" --target dev --no-version-check 2>&1 | tee /tmp/dbt-build.log

      - name: Scrubbed dbt summary
        if: always()
        run: python scripts/vanguard_dev_structural_check.py --scrub-dbt-log /tmp/dbt-build.log

      - name: Structural Vanguard checks
        if: success()
        run: python scripts/vanguard_dev_structural_check.py

      - name: Unknown Vanguard action labels
        if: failure()
        run: python scripts/vanguard_dev_structural_check.py --unknown-actions

      - name: Structural Fidelity checks
        if: success()
        run: python scripts/vanguard_dev_structural_check.py --broker fidelity

      - name: Unknown Fidelity action labels
        if: failure()
        run: python scripts/vanguard_dev_structural_check.py --broker fidelity --unknown-actions

      - name: Structural Empower checks
        if: success()
        run: python scripts/vanguard_dev_structural_check.py --broker empower

      - name: Unknown Empower action labels
        if: failure()
        run: python scripts/vanguard_dev_structural_check.py --broker empower --unknown-actions

      - name: Empower raw activity summary (select only)
        if: success()
        env:
          SECRET_KEY: diagnostic
          HAPPYTRADER_SKIP_DB_INIT: "1"
        run: python scripts/empower_raw_activity_summary.py

name: Private Vanguard health

# Dispatch-only, read-only check. Do not merge. Prints PASS/FAIL lines
# and does not write production data. Uses the same warehouse credential
# as dev_mirror.yml and bigquery_update.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-vanguard-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DBT_KEYFILE_JSON }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt
          pip install -q google-cloud-secret-manager

      - name: Read-only health flags
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}
          SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}
          GOOGLE_CLOUD_PROJECT: ccwj-dbt
          HAPPYTRADER_SKIP_DB_INIT: "1"
          RATELIMIT_ENABLED: "false"
          WTF_CSRF_ENABLED: "false"
          SECRET_KEY: read-only-health-check
        run: python -W ignore scripts/private_vanguard_health.py

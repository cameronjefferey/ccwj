name: Private Vanguard health

# Dispatch-only, read-only check. Do not merge. Prints PASS/FAIL lines
# and does not write production data. Uses the same warehouse credential
# as dev_mirror.yml and bigquery_update.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-vanguard-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DBT_KEYFILE_JSON }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q "google-cloud-bigquery==3.30.0"

      - name: Read-only warehouse flag
        env:
          GOOGLE_CLOUD_PROJECT: ccwj-dbt
        run: python -W ignore scripts/private_vanguard_health.py

name: CI

# Correctness is the product. Run the pytest suite on every PR and on
# pushes that touch app/tests/dbt/scripts so regressions can't land with
# only a green dbt build.
on:
  pull_request:
  push:
    branches: [master, main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'dbt/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'conftest.py'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: happytrader
          POSTGRES_PASSWORD: happytrader
          POSTGRES_DB: happytrader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-do-not-use-in-production
      TEST_DATABASE_URL: postgresql://happytrader:happytrader@localhost:5432/happytrader_test
      # BQ integration tests stay opt-in (need credentials + live warehouse).
      # NOTE: the tests gate on TRUTHINESS of the env var
      # (`os.environ.get("RUN_BQ_TESTS")`), so it must be UNSET or "" to
      # skip — the string "0" is truthy in Python and ENABLES them (broke
      # CI on 2026-08-07 with DefaultCredentialsError at setup).
      RUN_BQ_TESTS: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q --tb=short

  # Read-only production flags for one private account. This job runs only
  # for this branch's pull request: a workflow that is not on the default
  # branch cannot be dispatched, and this change must not be merged. It
  # does not run on any other pull request or on master.
  private-health:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'cursor/private-vanguard-health-631a' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DBT_KEYFILE_JSON }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt
          pip install -q google-cloud-secret-manager

      - name: Read-only health flags
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}
          SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}
          GOOGLE_CLOUD_PROJECT: ccwj-dbt
          HAPPYTRADER_SKIP_DB_INIT: "1"
          RATELIMIT_ENABLED: "false"
          WTF_CSRF_ENABLED: "false"
          SECRET_KEY: read-only-health-check
        run: python -W ignore scripts/private_vanguard_health.py
